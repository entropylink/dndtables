<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&D Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Paleta de marca entropy.com.mx */
    --bg:#080909; --bg2:#141515; --card:#1c1d1d; --card2:#242525;
    --ink:#ffffff; --muted:#b0b0b0; --line:#4a4b4b;
    --gold:#a8d300; --gold2:#8aae00; --cyan:#00ffff; --cyan2:#1a8a8a;
    --green:#a8d300; --red:#ff6b6b; --red2:#8a3f38;
    --blue:#00ffff; --purple:#c9a8ff; --purple2:#6a5a9a;
    --amber:#ffcf66; --amber2:#8a6a1a; --on-gold:#1a1b0a;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  html,body{margin:0;padding:0}
  body{
    background:transparent;
    color:var(--ink); font-family:"Ubuntu","Segoe UI",Arial,sans-serif; font-weight:400;
    line-height:1.5; padding:0 0 80px;
  }
  [hidden]{display:none !important}
  /* particle background */
  #bg{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block}
  header,.wrap,.tabbar,.hostbar{position:relative; z-index:1}
  #bgToggle{position:fixed; left:14px; bottom:14px; z-index:21; width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; padding:0; font-size:1rem; color:var(--gold);
    border-color:var(--gold2); background:var(--bg2); opacity:.5}
  #bgToggle:hover{opacity:1; color:var(--cyan); border-color:var(--cyan)}
  #langToggle{position:fixed; right:14px; top:14px; z-index:22; padding:6px 13px; font-weight:700; font-size:.82rem;
    background:var(--gold); color:var(--on-gold); border-color:var(--gold)}
  #langToggle:hover{background:var(--gold2); border-color:var(--gold2); color:var(--on-gold)}
  header{
    background:linear-gradient(180deg, rgba(14,15,15,.82), rgba(8,9,9,.5));
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    border-bottom:2px solid var(--gold); padding:22px 18px 18px; text-align:center;
  }
  header h1{margin:0 0 4px; font-size:1.7rem; font-weight:700; letter-spacing:.5px; color:var(--gold)}
  header p{margin:0; color:var(--muted); font-size:.92rem}
  .wrap{max-width:1080px; margin:0 auto; padding:0 16px}
  /* tabs */
  .tabbar{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:1080px; margin:0 auto; padding:14px 16px 0}
  .tabbtn{display:inline-flex; align-items:center; gap:6px; border-radius:20px; padding:6px 15px; background:rgba(28,29,29,.85)}
  .tabbtn[aria-selected="true"]{background:var(--gold); color:var(--on-gold); border-color:var(--gold); font-weight:700}
  .tabbtn[aria-selected="true"]:hover{color:var(--on-gold)}
  .tab-error{background:var(--bg2); border:1px solid var(--red2); color:var(--red); border-radius:10px; padding:14px; margin-top:18px}
  .hostbar{max-width:1080px; margin:10px auto 0; padding:6px 12px; border:1px solid var(--cyan2); border-radius:8px;
    background:var(--bg2); color:var(--muted); font-size:.82rem; width:calc(100% - 32px)}
  h2{color:var(--gold); font-weight:700; background:rgba(28,29,29,.80);
    border:1px solid var(--line); border-left:3px solid var(--gold);
    padding:8px 14px; border-radius:8px; margin:34px 0 14px; font-size:1.25rem;
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px)}
  h3{color:var(--gold); font-weight:700; margin:0 0 8px; font-size:1.05rem}
  .sub{color:var(--muted); font-size:.85rem}
  a{color:var(--cyan)}
  a:hover{color:var(--gold)}
  button{
    font-family:inherit; cursor:pointer; border:1px solid var(--line);
    background:var(--card2); color:var(--ink);
    padding:8px 14px; border-radius:7px; font-size:.92rem; transition:.12s;
  }
  button:hover{background:var(--card2); border-color:var(--cyan); color:var(--cyan); transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.primary{background:var(--gold); color:var(--on-gold); font-weight:700; border-color:var(--gold)}
  button.primary:hover{background:var(--gold2); border-color:var(--gold2); color:var(--on-gold)}
  button.small{padding:4px 9px; font-size:.8rem}
  button.ghost{background:transparent}
  button.host{border-color:var(--cyan2); color:var(--cyan)}
  input,select{
    font-family:inherit; background:var(--bg2); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:7px 9px; font-size:.9rem;
  }
  input:focus,select:focus{outline:none; border-color:var(--cyan)}
  input[type=number]{width:74px}
  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .controls{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:18px}
  /* size picker */
  .sizes{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:8px; margin-top:12px}
  .size-btn{display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 6px; text-align:center}
  .size-btn .n{font-weight:700; font-size:.95rem}
  .size-btn .p{font-size:.72rem; color:var(--muted)}
  .size-btn.active{outline:2px solid var(--gold); background:var(--card2)}
  /* settlement state & weekly event */
  .statusgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-top:14px}
  .scard{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:12px; padding:12px 14px}
  .scard.event{border-left-color:var(--cyan)}
  .scard .shead{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .scard .st{font-weight:700; color:var(--gold); font-size:1.02rem}
  .scard.event .st{color:var(--cyan)}
  .scard .sd{font-size:.84rem; color:var(--muted); margin-top:4px}
  .fx{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
  /* cards */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px}
  .vendor,.rcard{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:0 2px 0 #0006}
  .vendor.travel{border-color:var(--cyan)}
  .vhead{display:flex; align-items:flex-start; gap:10px; margin-bottom:8px}
  .vicon{font-size:1.7rem; line-height:1}
  .vname{font-weight:700; font-size:1.08rem; color:var(--gold)}
  .vtag{display:inline-block; font-size:.68rem; padding:1px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); margin:0 4px 2px 0}
  .vtag.basic{color:var(--green); border-color:var(--gold2)}
  .vtag.var{color:var(--cyan); border-color:var(--cyan2)}
  .vtag.travel{color:var(--purple); border-color:var(--purple2)}
  .vtag.comp{color:var(--red); border-color:var(--red2)}
  .vtag.mod{color:var(--amber); border-color:var(--amber2)}
  .vtag.good{color:var(--green); border-color:var(--gold2)}
  .vtag.bad{color:var(--red); border-color:var(--red2)}
  .npc{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; margin:6px 0; font-size:.82rem}
  .npc .who{font-weight:700}
  .npc .sub{font-size:.78rem}
  .npc details{margin:4px 0 0; padding:0; border:0; background:none}
  .npc details[open]{padding:0}
  .npc summary{padding:2px 0; font-size:.8rem; color:var(--cyan); font-weight:400}
  .goods{width:100%; border-collapse:collapse; margin:8px 0 6px; font-size:.86rem}
  .goods td{padding:3px 4px; border-bottom:1px dotted var(--line)}
  .goods td.price{text-align:right; white-space:nowrap; color:var(--ink); font-variant-numeric:tabular-nums}
  .goods td.base{text-align:right; white-space:nowrap; color:var(--muted); font-size:.78rem; text-decoration:line-through}
  .goods .up{color:var(--red)} .goods .down{color:var(--green)}
  .goods tr.out td:first-child{color:var(--muted); text-decoration:line-through}
  .goods tr.special td{border-bottom:1px solid var(--amber2)}
  .goods tr.special td:first-child{color:var(--amber)}
  .stk{font-size:.64rem; padding:0 6px; border-radius:10px; border:1px solid var(--line); margin-left:4px; white-space:nowrap; text-decoration:none; display:inline-block}
  .stk.out{color:var(--muted)} .stk.low{color:var(--red); border-color:var(--red2)} .stk.plenty{color:var(--green); border-color:var(--gold2)}
  .haggle{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:8px; font-size:.82rem}
  .haggle .hrow{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px}
  .note{font-size:.8rem; color:var(--muted); margin-top:4px; min-height:1em}
  .note.good{color:var(--green)} .note.bad{color:var(--red)}
  .vactions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
  .rcard .rt{font-weight:700; color:var(--gold)}
  .rcard .rv{margin:6px 0; font-size:.95rem}
  /* reference tables */
  details{background:var(--bg2); border:1px solid var(--line); border-radius:10px; margin:10px 0; padding:0 14px}
  details[open]{padding-bottom:14px}
  summary{cursor:pointer; padding:12px 0; font-weight:700; color:var(--gold); list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ "; color:var(--gold2)}
  details[open] summary::before{content:"▾ "}
  .refgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px}
  .tscroll{overflow-x:auto}
  table.ref{width:100%; border-collapse:collapse; font-size:.85rem; margin-top:6px}
  table.ref th,table.ref td{border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top}
  table.ref th{background:var(--gold); color:var(--on-gold); font-weight:700}
  table.ref tr:nth-child(even) td{background:var(--bg2)}
  table.ref caption{caption-side:top; text-align:left; font-weight:700; color:var(--gold); padding:4px 0}
  .die{display:inline-block; background:var(--bg2); border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:1px 8px; font-size:.8rem; font-weight:700}
  /* dice log */
  #log{position:fixed; right:14px; bottom:14px; width:250px; max-height:42vh; overflow:auto;
    background:var(--bg2); border:1px solid var(--gold); border-radius:10px; padding:10px; font-size:.8rem; z-index:20; box-shadow:0 6px 24px #000a}
  #log h4{margin:0 0 6px; color:var(--gold); font-size:.85rem; display:flex; justify-content:space-between}
  #log .l{padding:2px 0; border-bottom:1px dotted var(--line); color:var(--muted)}
  #log .l b{color:var(--ink)}
  .empty{color:var(--muted); font-style:italic; padding:16px; text-align:center; grid-column:1/-1}
  .savebar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px}
  .saved-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg2); margin-top:6px; font-size:.86rem}
  .saved-item.current{outline:1px solid var(--gold)}
  .saved-item .meta{color:var(--muted); font-size:.78rem}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:30; background:var(--card2); border:1px solid var(--gold);
    color:var(--ink); padding:8px 16px; border-radius:8px; font-size:.86rem; box-shadow:0 6px 24px #000a}
  .flash{animation:flash .6s ease}
  @keyframes flash{0%{background:var(--card2)}100%{}}
  /* embebida en Veil (app.html?velo=<mundo>): sin fondo animado, cabecera compacta */
  html.embedded #bg, html.embedded #bgToggle{display:none}
  html.embedded header{padding:12px 70px 10px}
  html.embedded header h1{font-size:1.25rem}
  html.embedded body{padding-bottom:40px}
  @media (max-width:560px){
    #log{position:static; width:auto; max-height:none; margin:20px 16px 0}
    header{padding:18px 64px 14px}
    header h1{font-size:1.35rem}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<button id="bgToggle" data-i18n-title="bgToggleTitle" title="Pause / resume the particle background">✦</button>
<button id="langToggle" title="Cambiar a español">ES</button>
<header>
  <h1 id="appTitle">🎲 D&amp;D Tables</h1>
  <p id="appTagline"></p>
</header>
<nav class="tabbar" id="tabBar" role="tablist"></nav>
<div class="hostbar" id="hostBar" hidden></div>
<main class="wrap" id="panels"></main>
<p class="sub" id="appVersion" style="position:relative; z-index:1; text-align:center; margin:28px 16px 0"></p>

<div id="log">
  <h4>🎲 <span data-i18n="logTitle">Roll log</span> <button class="small ghost" id="clearLog" data-i18n="clearBtn">clear</button></h4>
  <div id="logList"><div class="l logempty" data-i18n="logEmpty">You haven't rolled anything yet.</div></div>
</div>

<!-- ===================== PESTAÑA · VENDEDORES (marcado) ===================== -->
<template id="tpl-vendors">
  <div class="controls">
    <div class="row" style="justify-content:space-between">
      <div><h3 style="margin:0" data-i18n="chooseSize">1 · Choose the settlement size</h3><span class="sub" data-i18n="chooseSizeSub">From a wandering troupe to a megalopolis</span></div>
    </div>
    <div class="sizes" data-ref="sizePicker"></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" data-ref="genBtn" data-i18n="genBtn">🎲 Generate settlement</button>
      <button class="small" data-ref="regenPerm" data-i18n="regenPerm">↻ Permanent only</button>
      <button class="small" data-ref="newWeek" data-i18n="newWeek">↻ New week</button>
      <span class="sub" data-ref="genInfo"></span>
    </div>
    <div class="row" style="margin-top:10px" data-ref="shareRow" hidden>
      <button class="small" data-ref="copyMd" data-i18n="copyMd">📋 Copy as Markdown</button>
      <button class="small host" data-ref="toScreen" data-i18n="toScreen" hidden>▤ To the DM screen</button>
      <button class="small host" data-ref="toArticle" data-i18n="toArticle" hidden>¶ Settlement article</button>
    </div>
  </div>

  <div class="statusgrid" data-ref="statusGrid" hidden></div>

  <h2 data-i18n-html="permHead">Permanent vendors <span class="sub">— the basics to live, plus stalls that add variety</span></h2>
  <div class="grid" data-ref="permGrid"><div class="empty" data-i18n="permEmpty">Pick a size and press "Generate settlement".</div></div>

  <h2 data-i18n-html="travHead">Traveling vendors <span class="sub">— they change week to week; sometimes several, sometimes none</span></h2>
  <div class="grid" data-ref="travelGrid"><div class="empty">—</div></div>

  <h2 data-i18n="saveTitle">💾 Saved cities</h2>
  <div class="controls">
    <div class="savebar">
      <input type="text" data-ref="saveName" data-i18n-ph="saveNamePh" placeholder="City name" style="flex:1; min-width:160px">
      <button data-ref="renameBtn" data-i18n="renameBtn">Rename</button>
      <button data-ref="exportBtn" data-i18n="exportCurrent">⬇ Export current</button>
      <button data-ref="exportAllBtn" data-i18n="exportAll">⬇ Export all</button>
      <button data-ref="importBtn" data-i18n="importBtn">⬆ Import .json</button>
    </div>
    <div data-ref="savedList" style="margin-top:10px"></div>
  </div>

  <h2 data-i18n-html="refHead">📖 Reference tables <span class="sub">— with dice and distribution for rolling by hand</span></h2>

  <details>
    <summary><span data-i18n="sum1">Settlement sizes &amp; how many vendors</span></summary>
    <div class="tscroll"><table class="ref" data-ref="sizeRefTable"></table></div>
    <p class="sub" data-i18n="ref1p">Traveling vendors are determined each week (or day). The total can be 0. Duplicates are allowed: two selling almost the same thing create competition and push prices down.</p>
  </details>

  <details>
    <summary><span data-i18n="sumState">Settlement state</span> <span class="die">d20</span></summary>
    <p class="sub" data-i18n-html="refStateP">Roll <b>1d20</b> once per settlement. The state shifts prices and stock by category, how many traveling vendors show up, and which ones are more likely.</p>
    <div class="tscroll"><table class="ref" data-ref="stateRefTable"></table></div>
  </details>

  <details>
    <summary><span data-i18n="sum2">Permanent variety vendors</span> <span class="die">d100</span> <span class="sub" data-ref="varSizeLbl"></span></summary>
    <p class="sub" data-i18n-html="ref2p">Weighted table, adjusted to the selected size: everyday trades take wide ranges, rare shops narrow ones (and grow in big cities). Roll <b>1d100</b> for each variety stall shown in the sizes table. Reroll if a duplicate comes up.</p>
    <div class="tscroll"><table class="ref" data-ref="varRefTable"></table></div>
  </details>

  <details>
    <summary><span data-i18n="sumEvent">Weekly market event</span> <span class="die">d20</span></summary>
    <p class="sub" data-i18n-html="refEventP">Roll <b>1d20</b> at the start of each week, <b>before</b> the traveling vendors: some events add or remove vendors.</p>
    <div class="tscroll"><table class="ref" data-ref="eventRefTable"></table></div>
  </details>

  <details>
    <summary><span data-i18n="sum3">Traveling vendors</span> <span class="die">d100</span> <span class="sub" data-ref="travStateLbl"></span></summary>
    <p class="sub" data-i18n-html="ref3p">First determine <b>how many</b> with the die from the sizes table (min. 0), adjusted by the state and the weekly event. Then roll <b>1d100</b> for each one here. Duplicates are valid.</p>
    <div class="tscroll"><table class="ref" data-ref="travelRefTable"></table></div>
  </details>

  <details>
    <summary><span data-i18n="sum4">Price variation &amp; competition</span> <span class="die">d12</span></summary>
    <p class="sub" data-i18n-html="ref4p">Roll <b>1d12</b> per vendor for its price level vs. the book's base price. If two or more sell the same category, also apply <b>−10%</b> for competition.</p>
    <div class="tscroll"><table class="ref" data-ref="priceRefTable"></table></div>
  </details>

  <details>
    <summary><span data-i18n="sumStock">Stock of the day &amp; special piece</span> <span class="die">d6</span></summary>
    <p class="sub" data-i18n-html="refStockP">Roll <b>1d6</b> per item (services are always available). The settlement state can add or subtract from the roll. Then <b>1d6</b> per vendor: on <b>4+</b> they have a special piece — roll <b>1d6</b> on their category's table.</p>
    <div class="refgrid">
      <div class="tscroll"><table class="ref" data-ref="stockRefTable"></table></div>
      <div>
        <label class="sub"><span data-i18n="colCategory">Category</span> <select data-ref="specialCat"></select></label>
        <div class="tscroll"><table class="ref" data-ref="specialRefTable"></table></div>
      </div>
    </div>
  </details>

  <details>
    <summary><span data-i18n="sumNpc">The shopkeeper</span> <span class="die">d20 · d12 · d6</span></summary>
    <p class="sub" data-i18n-html="refNpcP">One roll on each table per vendor. The <b>attitude</b> changes the haggling DC. The rumor's <b>truth</b> is for the DM only.</p>
    <div class="refgrid" data-ref="npcRefGrid"></div>
  </details>

  <details>
    <summary><span data-i18n="sum5">Haggling with Persuasion</span> <span class="die" data-i18n="hagDie">1d20 + CHA</span></summary>
    <p data-i18n-html="ref5intro">Compare your <b>Persuasion (Charisma) check</b> with the vendor's <b>DC</b> (shown on each card):</p>
    <div class="tscroll"><table class="ref" data-i18n-html="haggleRules"></table></div>
    <p class="sub" data-i18n="ref5note">Use each card's calculator: enter the total result and see the negotiated prices. Peddlers and charlatans give a lot; temples, enchanters and famed smiths, little.</p>
  </details>

  <p class="sub" style="margin-top:24px; text-align:center" data-i18n-html="footer">Base prices from the D&D 5e equipment tables (gp = gold · sp = silver · cp = copper). Exotic, magical or dubious items use estimated values. Adjust to your world freely.</p>
</template>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
/* =====================================================================
 * NÚCLEO · D&D Tables
 * ---------------------------------------------------------------------
 * Todo lo que no es de una pestaña concreta: idioma, dados y tablas con
 * pesos, registro de tiradas, almacén de resultados (con migración y
 * separación por mundo), exportar/importar, biblioteca de guardados,
 * registro de pestañas y el puente con Veil.
 *
 * Una pestaña nueva es un <script> que llama a DT.registerTab({...}) o
 * DT.simpleTableTab({...}). Ver docs/ADDING_TABS.md.
 * ===================================================================== */
"use strict";
const DT = window.DT = {};
DT.VERSION = "3.1.0";
DT.SCHEMA = 3;
DT.lib = {};   // datos que comparten varias pestañas (ver el bloque DATOS COMPARTIDOS)

/* ===================== ANFITRIÓN (suelta o dentro de Veil) ===================== */
// app.html?velo=<mundo> → los datos se guardan con prefijo de mundo. Si además está en un
// <iframe>, habla con Veil por postMessage (ver veil/index.js).
DT.params = (function(){ try{ return new URLSearchParams(location.search); }catch(e){ return new URLSearchParams(); } })();
DT.host = (function(){
  const world = (DT.params.get("velo")||"").trim();
  let framed = false; try{ framed = window.parent && window.parent !== window; }catch(e){ framed = true; }
  return { kind: world ? "veil" : "standalone", world: world || null, embedded: !!(world && framed),
           connected:false, canEdit:true, caps:{}, worldName:"" };
})();
if(DT.host.embedded) document.documentElement.classList.add("embedded");

/* ===================== ALMACENAMIENTO ===================== */
// Contenido (resultados guardados) → con prefijo de mundo cuando corre dentro de Veil.
// Preferencias (idioma, fondo, última pestaña) → compartidas, con prefijo "dndtables.".
DT.storage = (function(){
  let ls = null;
  try{ ls = window.localStorage; const k="__dt_probe"; ls.setItem(k,"1"); ls.removeItem(k); }catch(e){ ls = null; }
  const mem = new Map();
  const NS = DT.host.world ? "velo:"+DT.host.world+":" : "";
  const get = k=>{ try{ return ls ? ls.getItem(k) : (mem.has(k)?mem.get(k):null); }catch(e){ return mem.has(k)?mem.get(k):null; } };
  const set = (k,v)=>{ try{ if(ls){ ls.setItem(k,v); return true; } }catch(e){ console.warn("[dndtables] storage full or blocked:", e && e.message); DT.toast && DT.toast(DT.t("storageFull")); } mem.set(k,v); return false; };
  const del = k=>{ try{ ls && ls.removeItem(k); }catch(e){} mem.delete(k); };
  return {
    ns: NS, persistent: !!ls,
    getJSON(k, fb){ try{ const v = JSON.parse(get(NS+k)); return v==null ? fb : v; }catch(e){ return fb; } },
    setJSON(k, v){ return set(NS+k, JSON.stringify(v)); },
    del(k){ del(NS+k); },
    rawGet: get,
    pref(k, v){
      const key = "dndtables."+k;
      if(arguments.length > 1){ if(v==null) del(key); else set(key, String(v)); return v; }
      return get(key);
    }
  };
})();

DT.money = function(cp){
  cp = Math.round(cp);
  if(cp<=0) return "—";
  const gp=Math.floor(cp/100); cp-=gp*100;
  const sp=Math.floor(cp/10); const c=cp-sp*10;
  const loc = DT.lang==="en" ? "en" : "es";
  const S = DT.lang==="en" ? ["gp","sp","cp"] : ["po","pp","pc"];
  const p=[];
  if(gp) p.push(gp.toLocaleString(loc)+" "+S[0]);
  if(sp) p.push(sp+" "+S[1]);
  if(c) p.push(c+" "+S[2]);
  return p.join(" ");
};

/* ===================== DADOS Y TABLAS ===================== */
// Generador reemplazable (las pruebas usan DT.seed(n) para repetir resultados).
DT.rng = Math.random;
DT.seed = function(s){
  let a = (s>>>0) || 1;
  DT.rng = function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
};
DT.rollDie = sides => Math.floor(DT.rng()*sides)+1;
DT.rollDice = function(count, die, mod=0){
  let s=0; const rolls=[];
  for(let i=0;i<count;i++){ const r=DT.rollDie(die); rolls.push(r); s+=r; }
  return {total:Math.max(0, s+mod), rolls, mod};
};
DT.diceLabel = (c,d,m)=> `${c}d${d}${m?(m>0?"+"+m:"−"+Math.abs(m)):""}`;
DT.parseDice = function(str){
  const src = String(str).replace(/−/g,"-").replace(/\s+/g,"");
  const m = src.match(/^(\d*)d(\d+)([+-]\d+)?$/i);
  if(m) return {count: m[1]?parseInt(m[1],10):1, die: parseInt(m[2],10), mod: m[3]?parseInt(m[3],10):0};
  const n = parseInt(src,10); return isNaN(n) ? null : {count:0, die:1, mod:n};
};
DT.rangeLabel = r => r.lo===r.hi ? String(r.lo) : `${r.lo}–${r.hi}`;
// Atajos para escribir tablas en los datos: "texto en español|English text".
//   DT.row("Lobos|Wolves", {w:2, only:{…}})  → una fila con peso
//   DT.rowsFixed(["Uno|One", "Dos|Two"])      → filas 1, 2, 3… (una cara cada una)
DT.row = (x, extra)=>{ const [es,en] = String(x).split("|"); return Object.assign({text:{es, en:en==null?es:en}}, extra||{}); };
DT.rowsFixed = list=> list.map((x,i)=> Object.assign(DT.row(x), {lo:i+1, hi:i+1}));

// Reparte las caras de un dado entre filas con peso (resto mayor; toda fila con peso > 0 recibe ≥ 1 cara).
// Devuelve un rango {lo,hi} por fila (null si su peso es 0). Así un d100 con pesos significa algo
// al tirar a mano: las filas comunes ocupan rangos anchos y las raras, estrechos.
DT.faces = function(weights, sides, id){
  const live = []; weights.forEach((w,i)=>{ if(w>0) live.push(i); });
  const out = weights.map(()=>null);
  if(!live.length) return out;
  if(live.length > sides) throw new Error(`[dndtables] table "${id||"?"}": ${live.length} rows don't fit on a d${sides}`);
  const W = live.reduce((s,i)=>s+weights[i],0);
  const exact = live.map(i=> weights[i]*sides/W);
  const alloc = exact.map(x=> Math.max(1, Math.floor(x)));
  let sum = alloc.reduce((a,b)=>a+b,0);
  // El resto se mide contra lo ya asignado: una fila subida al mínimo (1) ya no "debe" nada.
  const order = exact.map((x,k)=>({k, r:x-alloc[k]})).sort((a,b)=> b.r-a.r || a.k-b.k);
  for(let j=0; sum<sides; j++){ alloc[order[j % order.length].k]++; sum++; }
  while(sum>sides){
    let best=-1; for(let k=0;k<alloc.length;k++){ if(alloc[k]>1 && (best<0 || alloc[k]-exact[k] > alloc[best]-exact[best])) best=k; }
    alloc[best]--; sum--;
  }
  let lo=1; live.forEach((i,k)=>{ out[i]={lo, hi:lo+alloc[k]-1}; lo+=alloc[k]; });
  return out;
};

// Una tabla tirable. def = {id, die, rows:[{…, w?} | {…, lo, hi}]}.
//   · Filas con lo/hi → rangos fijos (tablas "de libro").
//   · Si no, pesos (w, por defecto 1) → DT.faces. weight(row) permite pesos calculados (tamaño, estado…).
DT.table = function(def){
  if(!def || !Array.isArray(def.rows) || !def.die) throw new Error("[dndtables] DT.table needs {die, rows}");
  const fixed = def.rows.length>0 && def.rows.every(r=> r.lo!=null && r.hi!=null);
  const t = {
    id:def.id||"", die:def.die, rows:def.rows, fixed,
    ranges(weightFn){
      if(fixed && !weightFn) return def.rows.map(r=>({lo:r.lo, hi:r.hi, row:r}));
      const ws = def.rows.map(r=> Math.max(0, Number(weightFn ? weightFn(r) : (r.w==null?1:r.w)) || 0));
      const f = DT.faces(ws, def.die, def.id);
      return def.rows.map((r,i)=> f[i] ? {lo:f[i].lo, hi:f[i].hi, row:r} : null).filter(Boolean);
    },
    lookup(n, weightFn){ return t.ranges(weightFn).find(r=> n>=r.lo && n<=r.hi) || null; },
    roll(weightFn){
      const ranges = t.ranges(weightFn);
      if(!ranges.length) return null;
      const n = DT.rollDie(def.die);
      const hit = ranges.find(r=> n>=r.lo && n<=r.hi);
      return {roll:n, row:hit.row, lo:hit.lo, hi:hit.hi};
    },
    byId(id){ return def.rows.find(r=> r.id===id) || null; }
  };
  if(fixed){
    const seen = new Array(def.die+1).fill(0);
    def.rows.forEach(r=>{ for(let n=r.lo;n<=r.hi;n++) seen[n]++; });
    for(let n=1;n<=def.die;n++) if(seen[n]!==1) console.warn(`[dndtables] table "${def.id}": face ${n} is covered ${seen[n]} times`);
  }
  return t;
};
// Tabla de referencia genérica: cols = [{h:"cabecera", f:(rango)=>html}] (el html ya escapado).
DT.refTableHTML = function(table, cols, weightFn, caption){
  const rows = table.ranges(weightFn);
  return (caption?`<caption>${caption}</caption>`:"")+
    `<tr><th style="width:70px">d${table.die}</th>${cols.map(c=>`<th>${c.h}</th>`).join("")}</tr>`+
    rows.map(r=>`<tr><td>${DT.rangeLabel(r)}</td>${cols.map(c=>`<td>${c.f(r)}</td>`).join("")}</tr>`).join("");
};

/* ===================== RESULTADOS GUARDADOS ===================== */
// Un resultado de cualquier pestaña: {id, tab, name, savedAt, data, links?, legacyDate?}
const REC_KEY = "dndtables.v3.records";
const ACTIVE_KEY = "dndtables.v3.active";
const SYNC_KEY = "dndtables.v3.synced";   // ids que el mundo de Veil ya tiene (para distinguir borrados de nuevos)
const recListeners = [];
DT.records = (function(){
  let cache = null;
  function read(){
    let a = DT.storage.getJSON(REC_KEY, null);
    if(!Array.isArray(a)){ a = DT.host.world ? [] : migrateLegacy(); if(a.length) DT.storage.setJSON(REC_KEY, a); }
    return a.filter(r=> r && typeof r==="object" && r.id && r.tab);
  }
  // Leer → cambiar → escribir, siempre sobre lo que hay guardado AHORA: si la app está abierta en
  // dos pestañas del mismo mundo (Veil y «Abrir aparte»), ninguna pisa lo que escribió la otra.
  function commit(fn){ cache = read(); const out = fn(cache); DT.storage.setJSON(REC_KEY, cache); return out; }
  function emit(ev){ for(const fn of recListeners){ try{ fn(ev); }catch(e){ console.error(e); } } }
  const api = {
    all(){ if(!cache) cache = read(); return cache; },
    list(tab){ return api.all().filter(r=> r.tab===tab); },
    get(id){ return api.all().find(r=> r.id===id) || null; },
    // Guarda (o actualiza) un resultado. opts.keepTime conserva savedAt; opts.fromHost no se reenvía a Veil.
    upsert(rec, opts={}){
      if(!rec.id) rec.id = DT.uid();
      if(!opts.keepTime || !rec.savedAt) rec.savedAt = Date.now();
      commit(list=>{ const i = list.findIndex(r=> r.id===rec.id); if(i>=0) list[i]=rec; else list.push(rec); });
      emit({type:"upsert", rec, opts});
      return rec;
    },
    remove(id, opts={}){
      const rec = commit(list=>{ const i = list.findIndex(r=> r.id===id); return i>=0 ? list.splice(i,1)[0] : null; });
      if(!rec) return false;
      const act = DT.storage.getJSON(ACTIVE_KEY, {}); if(act[rec.tab]===id){ delete act[rec.tab]; DT.storage.setJSON(ACTIVE_KEY, act); }
      emit({type:"remove", rec, opts});
      return true;
    },
    active(tab){ const a=DT.storage.getJSON(ACTIVE_KEY, {}); return a[tab] ? api.get(a[tab]) : null; },
    setActive(tab, id){ const a=DT.storage.getJSON(ACTIVE_KEY, {}); if(id) a[tab]=id; else delete a[tab]; DT.storage.setJSON(ACTIVE_KEY, a); },
    onChange(fn){ recListeners.push(fn); },
    reload(){ cache = read(); }
  };
  // Otra pestaña del mismo origen (y mundo) cambió los resultados: se vuelve a leer y se avisa.
  window.addEventListener("storage", e=>{
    if(e.key!==null && e.key!==DT.storage.ns+REC_KEY) return;
    cache = null; emit({type:"external"});
  });
  // Ciudades de la versión 2 (dnd_vendor_cities_v2) y 1 (dnd_vendor_saves_v1) → pestaña "vendors".
  // Las claves viejas no se tocan: si algo sale mal, siguen ahí.
  function migrateLegacy(){
    const read = k=>{ try{ const v=JSON.parse(DT.storage.rawGet(k)); return Array.isArray(v)?v:null; }catch(e){ return null; } };
    const src = read("dnd_vendor_cities_v2") || read("dnd_vendor_saves_v1") || [];
    return src.filter(c=> c && c.data).map(c=>({id:String(c.id||DT.uid()), tab:"vendors", name:String(c.name||"City"), savedAt:0, legacyDate:String(c.date||""), data:c.data}));
  }
  return api;
})();
DT.recordDate = rec => rec.savedAt ? DT.fmtDate(rec.savedAt) : (rec.legacyDate||"");

/* ===================== EXPORTAR / IMPORTAR ===================== */
DT.io = {
  download(payload, name){
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=String(name||"dndtables").replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g,"_").toLowerCase()+".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
  },
  exportRecord(rec){ DT.io.download({type:"dndtables-record", version:DT.SCHEMA, app:DT.VERSION, record:rec}, rec.name); },
  exportMany(recs, name){ DT.io.download({type:"dndtables-collection", version:DT.SCHEMA, app:DT.VERSION, records:recs}, name||"dndtables_all"); },
  // Convierte cualquier JSON conocido en resultados válidos. Las pestañas pueden adoptar formatos
  // propios o antiguos con tab.adoptForeign(obj) → [resultados] | null.
  parse(obj){
    let recs = null;
    if(obj && obj.type==="dndtables-record" && obj.record) recs = [obj.record];
    else if(obj && obj.type==="dndtables-collection" && Array.isArray(obj.records)) recs = obj.records;
    else for(const tab of DT.tabList()){ if(tab.adoptForeign){ const r = tab.adoptForeign(obj); if(r && r.length){ recs = r; break; } } }
    if(!recs) return null;
    const ok=[]; let skipped=0;
    for(const r of recs){
      const tab = r && DT.tabs.get(r.tab);
      if(!tab || !r.data || (tab.validate && !tab.validate(r.data))){ skipped++; continue; }
      ok.push({id:String(r.id||DT.uid()), tab:r.tab, name:String(r.name||DT.t("imported")), savedAt:Number(r.savedAt)||0,
               legacyDate:r.legacyDate?String(r.legacyDate):undefined, data:r.data, links:(r.links&&typeof r.links==="object")?r.links:undefined});
    }
    return {records:ok, skipped};
  },
  // Guarda lo importado: un id repetido recibe uno nuevo (nunca pisa lo que ya hay).
  importRecords(list){
    const ids = new Set(DT.records.all().map(r=>r.id));
    const added=[];
    for(const r of list){ if(ids.has(r.id)) r.id = DT.uid(); ids.add(r.id); added.push(DT.records.upsert(r, {keepTime:!!r.savedAt})); }
    return added;
  },
  pickFile(){
    const inp=document.getElementById("importFile");
    inp.onchange = e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
      const rd=new FileReader();
      rd.onload = ev=>{
        let res=null; try{ res = DT.io.parse(JSON.parse(ev.target.result)); }catch(err){ res=null; }
        if(!res || !res.records.length){ alert(DT.t("alertBadFile")); return; }
        const added = DT.io.importRecords(res.records);
        DT.toast(DT.t("importDone",{n:added.length}) + (res.skipped?" "+DT.t("importSkipped",{n:res.skipped}):""));
        const first = added[0], tab = first && DT.tabs.get(first.tab);
        if(added.length===1 && tab){ DT.showTab(tab.id); tab.load && tab.load(first); }
        else DT.refreshLibraries();
      };
      rd.readAsText(f);
    };
    inp.click();
  }
};

/* ===================== BIBLIOTECA (lista de guardados por pestaña) ===================== */
const libraries = new Set();
// DT.library(contenedor, tabId) → lista ordenada con cargar / exportar / borrar.
// La pestaña da el resumen con tab.summary(rec) → {chips:[…], meta:[…], detail:"…"} (texto plano; aquí se escapa).
DT.library = function(box, tabId){
  const lib = {box, tabId, render(){
    const tab = DT.tabs.get(tabId);
    const cur = DT.records.active(tabId);
    const recs = DT.records.list(tabId).slice().sort((a,b)=> (a.name||"").localeCompare(b.name||"", DT.lang));
    if(!recs.length){ box.innerHTML = `<div class="sub">${DT.esc(DT.t(tab.emptyLibraryKey||"noResults"))}</div>`; return; }
    box.innerHTML = recs.map(r=>{
      let s = {chips:[], meta:[], detail:""}; try{ s = Object.assign(s, tab.summary ? tab.summary(r) : {}); }catch(e){ console.error(e); }
      const isCur = cur && cur.id===r.id; const d = DT.recordDate(r);
      return `<div class="saved-item${isCur?" current":""}" data-id="${DT.esc(r.id)}">
        <div style="flex:1; min-width:0">
          <div><b>${DT.esc(r.name)}</b> ${s.chips.map(c=>`<span class="vtag var">${DT.esc(c)}</span>`).join("")}${isCur?` <span class="vtag basic">${DT.esc(DT.t("currentTag"))}</span>`:""}</div>
          <div class="meta">${DT.esc([...s.meta, d].filter(Boolean).join(" · "))}</div>
          ${s.detail?`<div class="meta" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${DT.esc(s.detail)}</div>`:""}
        </div>
        <div class="row">
          <button class="small" data-act="load">${DT.esc(DT.t("load"))}</button>
          <button class="small ghost" data-act="export" title="${DT.esc(DT.t("exportCurrent"))}">⬇</button>
          <button class="small ghost" data-act="delete" title="✕">✕</button>
        </div></div>`;
    }).join("");
    box.querySelectorAll(".saved-item").forEach(item=>{
      const rec = ()=> DT.records.get(item.dataset.id);
      item.querySelector('[data-act="load"]').onclick = ()=>{ const r=rec(); if(r && tab.load) tab.load(r); };
      item.querySelector('[data-act="export"]').onclick = ()=>{ const r=rec(); if(r) DT.io.exportRecord(r); };
      item.querySelector('[data-act="delete"]').onclick = ()=>{ const r=rec(); if(!r) return;
        if(!confirm(DT.t("deleteConfirm",{name:r.name}))) return;
        DT.records.remove(r.id); };
    });
  }};
  libraries.add(lib); lib.render();
  return lib;
};
DT.refreshLibraries = ()=> libraries.forEach(l=> l.render());
DT.records.onChange(ev=>{
  // Si lo que una pestaña tiene abierto se borró (aquí, en Veil o en otra pestaña) o cambió fuera, se entera.
  if(ev.type==="remove" || ev.type==="external"){
    for(const t of DT.tabs.values()){
      if(!t._mounted || typeof t.current!=="function") continue;
      const c = t.current(); if(!c) continue;
      const fresh = DT.records.get(c.id);
      try{
        if(!fresh) t.onRemoved && t.onRemoved(c);
        else if(ev.type==="external" && (fresh.savedAt||0) > (c.savedAt||0)) t.load && t.load(fresh);
      }catch(e){ console.error(e); }
    }
  }
  DT.refreshLibraries();
});

/* ===================== PESTAÑAS ===================== */
// DT.registerTab({
//   id, icon, order, title:{en,es}, heading?:{en,es}, tagline:{en,es}, strings:{en:{…},es:{…}}, template:"tpl-…",
//   mount(panel, DT), onShow(), onLang(),
//   summary(rec), validate(data), load(rec), current(), onRemoved(rec), adoptForeign(obj),
//   toMarkdown(rec, {dm}) → texto para copiar / mandar a la pantalla de DM
// })
DT.tabs = new Map();
DT.tabList = ()=> [...DT.tabs.values()].sort((a,b)=> (a.order??100)-(b.order??100));
DT.registerTab = function(def){
  if(!def || !/^[a-z0-9-]+$/.test(def.id||"")) throw new Error("[dndtables] registerTab: id must match [a-z0-9-]+");
  if(DT.tabs.has(def.id)) throw new Error(`[dndtables] registerTab: "${def.id}" is already registered`);
  if(typeof def.mount!=="function") throw new Error(`[dndtables] registerTab "${def.id}": mount(panel) is required`);
  if(!def.title || !def.title.en || !def.title.es) console.warn(`[dndtables] tab "${def.id}": title needs {en, es}`);
  if(def.strings) DT.addStrings(def.strings);
  DT.tabs.set(def.id, def);
  if(DT.started) renderChrome();
  return def;
};
let activeTab = null;
DT.activeTab = ()=> activeTab;
DT.showTab = function(id){
  const tab = DT.tabs.get(id) || DT.tabList()[0]; if(!tab) return;
  activeTab = tab.id;
  const panels = document.getElementById("panels");
  let panel = document.getElementById("panel-"+tab.id);
  if(!panel){
    panel = document.createElement("section"); panel.className="panel"; panel.id="panel-"+tab.id;
    panel.setAttribute("role","tabpanel"); panels.appendChild(panel);
    try{
      if(tab.template){ const tpl=document.getElementById(tab.template); if(tpl) panel.appendChild(tpl.content.cloneNode(true)); }
      DT.applyI18n(panel);
      tab.mount(panel, DT);
      tab._mounted = true;
    }catch(e){
      console.error(e);
      panel.innerHTML = `<div class="tab-error">${DT.esc(DT.t("tabFailed"))} ${DT.esc(e && e.message)}</div>`;
    }
  }
  panels.querySelectorAll(".panel").forEach(p=> p.hidden = (p!==panel));
  DT.storage.pref("tab", tab.id);
  renderChrome();
  try{ tab.onShow && tab.onShow(); }catch(e){ console.error(e); }
};
function renderChrome(){
  const bar = document.getElementById("tabBar");
  const list = DT.tabList();
  bar.hidden = list.length < 2;
  bar.innerHTML = list.map(t=>`<button class="tabbtn" role="tab" data-tab="${DT.esc(t.id)}" aria-selected="${t.id===activeTab}">${DT.esc(t.icon||"")} ${DT.esc(DT.tx(t.title))}</button>`).join("");
  bar.querySelectorAll(".tabbtn").forEach(b=> b.onclick = ()=> DT.showTab(b.dataset.tab));
  const tab = DT.tabs.get(activeTab);
  document.getElementById("appTitle").textContent = list.length<2 && tab ? `${tab.icon||""} ${DT.tx(tab.heading||tab.title)}`.trim() : DT.t("appTitle");
  document.getElementById("appTagline").textContent = tab ? DT.tx(tab.tagline) : "";
  document.title = (tab ? DT.tx(tab.title)+" — " : "") + DT.t("docTitle");
  const lb=document.getElementById("langToggle"); lb.textContent = DT.lang==="en"?"ES":"EN"; lb.title = DT.lang==="en"?"Cambiar a español":"Switch to English";
  const le=document.querySelector("#logList .logempty"); if(le) le.textContent = DT.t("logEmpty");
  renderHostBar();
}
DT.onLang(()=>{ for(const t of DT.tabs.values()) if(t._mounted){ try{ t.onLang && t.onLang(); }catch(e){ console.error(e); } } DT.refreshLibraries(); });

/* ===================== PESTAÑA DECLARATIVA (solo datos) ===================== */
// Para generadores del tipo "tira en estas tablas y enséñame el resultado". Guía: docs/ADDING_TABS.md.
// def = {id, icon, title, tagline, order?, strings?,
//   context?: [{id, title, options:[{id, text}], default?}],      → selectores; se guardan en data.ctx
//   tables:   [{id, title, die, hidden?, dm?, when?, count?, rows:[{id?, text, note?, w? | lo,hi, only?, weight?}]}],
//   recordName?(h), article?(rec, h)}
//  · only:{clave:[ids]}             la fila solo vale si el contexto —o el resultado de una tabla ANTERIOR— coincide
//  · weight:{clave:{id:factor}}     cambia su peso según lo mismo (las filas condicionadas usan pesos, no lo/hi)
//  · when:{clave:[ids]}             la tabla entera solo se tira si coincide
//  · count: "1d4" | 3 | {clave:{id:"1d4", default:1}}   tira la tabla varias veces
//  · {2d6*10} en el texto se tira al salir la fila y se guarda; EN y ES llevan los mismos dados en el mismo orden
//  · hidden: no sale como tarjeta (p. ej. piezas del nombre) · dm: no sale en lo que ven los jugadores
const DICE_TOKEN = /\{(\d*)d(\d+)(?:([+-])(\d+))?(?:[*x×](\d+))?\}/g;
DT.inlineDice = {
  roll(text){
    const vals = [];
    String(text).replace(DICE_TOKEN, (m,c,d,sg,k,mul)=>{
      let s=0; const n=c?+c:1; for(let i=0;i<n;i++) s+=DT.rollDie(+d);
      if(k) s += (sg==="-"?-1:1)*(+k); if(mul) s *= +mul;
      vals.push(Math.max(0,s)); return m;
    });
    return vals;
  },
  fill(text, vals){ let i=0; return String(text).replace(DICE_TOKEN, m=>{ const v = vals ? vals[i] : null; i++; return v!=null ? Number(v).toLocaleString(DT.lang==="en"?"en":"es") : m; }); },
  tokens(text){ return (String(text).match(DICE_TOKEN)||[]); }
};
DT.simpleTableTab = function(def){
  const ctxDefs = def.context || [];
  const rowText = row => row ? (row.text!=null ? row.text : row.name) : "";
  const srcText = row => { const t = rowText(row); return typeof t==="string" ? t : (t.en ?? t.es ?? ""); };
  const tables = def.tables.map(td=>{
    const t = DT.table({id:td.id, die:td.die, rows:td.rows});
    const conds = td.rows.some(r=> r.only || r.weight);
    if(t.fixed && conds) throw new Error(`[dndtables] ${def.id}/${td.id}: rows with only/weight must use weights (w), not lo/hi`);
    return Object.assign(t, {title:td.title, hidden:!!td.hidden, dm:!!td.dm, when:td.when||null, count:td.count==null?1:td.count, conds});
  });
  const byId = new Map(tables.map(t=>[t.id, t]));
  const keysOf = t=>{ const ks=new Set(Object.keys(t.when||{})); t.rows.forEach(r=>{ Object.keys(r.only||{}).forEach(k=>ks.add(k)); Object.keys(r.weight||{}).forEach(k=>ks.add(k)); }); if(t.count && typeof t.count==="object") Object.keys(t.count).forEach(k=>ks.add(k)); return ks; };
  tables.forEach((t,idx)=>{
    t.deps = keysOf(t);
    for(const k of t.deps) if(!ctxDefs.some(c=>c.id===k) && !tables.slice(0,idx).some(x=>x.id===k)) console.warn(`[dndtables] ${def.id}/${t.id}: condition key "${k}" is neither a context nor an earlier table`);
  });
  const matches = (cond, env)=> !cond || Object.entries(cond).every(([k,ids])=> env[k]!=null && ids.includes(env[k]));
  const weightFn = env=> row=>{
    if(!matches(row.only, env)) return 0;
    let w = row.w==null ? 1 : row.w;
    for(const [k,m] of Object.entries(row.weight||{})){ const f = m[env[k]]; if(f!=null) w *= f; }
    return w;
  };
  const defaultCtx = ()=> Object.fromEntries(ctxDefs.map(c=> [c.id, c.default || (c.options[0]||{}).id]));
  // Lo que ve una tabla: el contexto + la fila (id) que salió en cada tabla anterior.
  function envFor(data, uptoId){
    const env = Object.assign({}, data.ctx);
    for(const t of tables){
      if(t.id===uptoId) break;
      const r = (data.rolls[t.id]||[])[0];
      if(r && t.rows[r.i] && t.rows[r.i].id!=null) env[t.id] = t.rows[r.i].id;
    }
    return env;
  }
  function countFor(t, env){
    let c = t.count;
    if(c && typeof c==="object"){ const [k,map] = Object.entries(c)[0]; c = map[env[k]] ?? map.default ?? 1; }
    if(typeof c==="number") return c;
    const p = DT.parseDice(c); if(!p) return 1;
    const r = DT.rollDice(p.count, p.die, p.mod);
    if(p.count) DT.log(c, r.total, `${DT.tx(t.title)} ×`);
    return r.total;
  }
  function rollTable(t, data){
    const env = envFor(data, t.id);
    if(t.when && !matches(t.when, env)){ delete data.rolls[t.id]; return; }
    const n = countFor(t, env), wf = t.conds ? weightFn(env) : undefined, out = [];
    for(let k=0;k<n;k++){
      const r = t.roll(wf); if(!r) break;
      const vals = DT.inlineDice.roll(srcText(r.row));
      out.push(vals.length ? {roll:r.roll, i:t.rows.indexOf(r.row), vals} : {roll:r.roll, i:t.rows.indexOf(r.row)});
      DT.log("d"+t.die, r.roll, `${DT.tx(t.title)}: ${DT.inlineDice.fill(DT.tx(rowText(r.row)), vals)}`);
    }
    data.rolls[t.id] = out;
  }
  // Volver a tirar una tabla arrastra a las que dependen de ella (y a las que dependen de esas).
  function rerollFrom(tid, data){
    const idx = tables.findIndex(t=> t.id===tid); if(idx<0) return;
    const changed = new Set([tid]);
    rollTable(tables[idx], data);
    for(let j=idx+1;j<tables.length;j++){ const t=tables[j]; if([...t.deps].some(k=> changed.has(k))){ rollTable(t, data); changed.add(t.id); } }
  }
  function rollAll(ctx){ const data = {v:2, ctx:Object.assign(defaultCtx(), ctx||{}), rolls:{}}; tables.forEach(t=> rollTable(t, data)); return data; }
  const resText = (t, r)=> r && t.rows[r.i] ? DT.inlineDice.fill(DT.tx(rowText(t.rows[r.i])), r.vals) : "";
  const ctxText = (data, key)=>{ const c=ctxDefs.find(x=>x.id===key); const o=c && c.options.find(o=> o.id===(data.ctx||{})[key]); return o ? DT.tx(o.text) : ""; };
  function markdown(rec, opts={}){
    const d = rec.data, lines = [];
    if(!opts.noTitle) lines.push(`### ${DT.mdEsc(rec.name)}`, "");
    const cl = ctxDefs.map(c=> ctxText(d, c.id)).filter(Boolean);
    if(cl.length) lines.push(`*${cl.map(DT.mdEsc).join(" · ")}*`, "");
    for(const t of tables){
      if(t.hidden || (t.dm && !opts.dm)) continue;
      const rs = d.rolls[t.id]; if(!rs || !rs.length) continue;
      const items = rs.map(r=>{ const note = t.rows[r.i] && t.rows[r.i].note; return DT.mdEsc(resText(t, r))+(note?` — *${DT.mdEsc(DT.tx(note))}*`:""); });
      lines.push(`- **${DT.mdEsc(DT.tx(t.title))}** (d${t.die}: ${rs.map(r=>r.roll).join(", ")}): ${items.join("; ")}`);
    }
    return lines.join("\n")+"\n";
  }
  const helpers = rec=>({
    text:(tid,k=0)=> resText(byId.get(tid), (rec.data.rolls[tid]||[])[k]),
    texts:(tid)=> (rec.data.rolls[tid]||[]).map(r=> resText(byId.get(tid), r)),
    row:(tid,k=0)=>{ const r=(rec.data.rolls[tid]||[])[k]; return r ? byId.get(tid).rows[r.i] : null; },
    ctx:(key)=> (rec.data.ctx||{})[key], ctxText:(key)=> ctxText(rec.data, key),
    markdown:(opts)=> markdown(rec, opts),
    block:(marker, label)=> `:::nota ${marker} ${label}\n${markdown(rec, {noTitle:true, dm:false}).replace(/^:::.*$/gm,"")}\n:::`
  });
  function normalize(rec){
    const d = rec.data; d.ctx = Object.assign(defaultCtx(), d.ctx||{}); d.rolls = d.rolls || {};
    for(const t of tables){
      let rs = d.rolls[t.id]; if(rs==null) continue;
      if(!Array.isArray(rs)) rs = [rs];
      d.rolls[t.id] = rs.filter(r=> r && Number.isInteger(r.i) && r.i>=0 && r.i<t.rows.length)
        .map(r=> ({roll:parseInt(r.roll,10)||null, i:r.i, vals:Array.isArray(r.vals)?r.vals.map(Number):undefined}));
    }
    d.v = 2; return rec;
  }
  let cur = null, refs = null;
  const selCtx = ()=>{ const c = defaultCtx(); if(refs) refs.ctx.querySelectorAll("select[data-ctx]").forEach(s=>{ c[s.dataset.ctx]=s.value; }); return c; };
  function persist(){ if(cur){ DT.records.setActive(def.id, cur.id); DT.records.upsert(cur); } }
  function newName(){ return `${DT.tx(def.title)} ${DT.records.list(def.id).length+1}`; }
  function renderCtx(){
    refs.ctx.innerHTML = ctxDefs.map(c=>`<label class="sub">${DT.esc(DT.tx(c.title))} <select data-ctx="${DT.esc(c.id)}">${
      c.options.map(o=>`<option value="${DT.esc(o.id)}">${DT.esc(DT.tx(o.text))}</option>`).join("")}</select></label>`).join("");
    const c = cur ? cur.data.ctx : defaultCtx();
    refs.ctx.querySelectorAll("select[data-ctx]").forEach(s=>{ if(c[s.dataset.ctx]!=null) s.value = c[s.dataset.ctx]; s.onchange = renderRefs; });
  }
  function render(){
    if(!refs) return;
    refs.screen.hidden = !DT.host.caps.toScreen;
    refs.article.hidden = !(def.article && DT.host.caps.toArticle && cur);
    refs.nameDice.hidden = !def.recordName;
    const d = cur ? cur.data : null;
    refs.results.innerHTML = !d ? `<div class="empty">${DT.esc(DT.t("noResults"))}</div>` : tables.filter(t=> !t.hidden && d.rolls[t.id]).map(t=>{
      const rs = d.rolls[t.id];
      const items = rs.length ? rs.map(r=>{ const note = t.rows[r.i] && t.rows[r.i].note;
        return `<div class="rv"><b>${DT.esc(r.roll)}</b> · ${DT.esc(resText(t, r))}${note?`<div class="sub">${DT.esc(DT.tx(note))}</div>`:""}</div>`; }).join("")
        : `<div class="rv sub">${DT.esc(DT.t("noneThisTime"))}</div>`;
      return `<div class="rcard" data-t="${DT.esc(t.id)}"><div class="row" style="justify-content:space-between"><span class="rt">${DT.esc(DT.tx(t.title))}${t.dm?` <span class="vtag bad">DM</span>`:""}</span><span class="die">d${t.die}</span></div>
        ${items}<button class="small" data-act="roll">${DT.esc(DT.t("reroll"))}</button></div>`;
    }).join("");
    refs.results.querySelectorAll(".rcard").forEach(card=>{
      card.querySelector('[data-act="roll"]').onclick = ()=>{ if(!cur) return; rerollFrom(card.dataset.t, cur.data); persist(); render(); };
    });
    if(document.activeElement!==refs.name) refs.name.value = cur ? cur.name : "";
    renderRefs();
  }
  function renderRefs(){
    if(!refs) return;
    const env0 = selCtx(), d = cur ? cur.data : null;
    refs.refs.innerHTML = tables.map(t=>{
      // La tabla de referencia se ve con el contexto elegido; si depende de otra tabla, con lo que salió
      // (o con su primera opción, si aún no hay nada).
      const env = Object.assign({}, env0), notes = [];
      for(const k of t.deps){
        const dep = byId.get(k); if(!dep) continue;
        const r = d && (d.rolls[k]||[])[0];
        // Sin resultado todavía: la primera opción con la que esta tabla tiene algo que enseñar.
        const row = r ? dep.rows[r.i] : dep.rows.find(x=> x.id!=null && (!t.conds || t.rows.some(y=> weightFn(Object.assign({}, env, {[k]:x.id}))(y)>0)));
        if(row){ env[k] = row.id; notes.push(`${DT.tx(dep.title)} = ${DT.tx(rowText(row)).replace(DICE_TOKEN,"…")}`); }
      }
      let html;
      try{ html = DT.refTableHTML(t, [{h:DT.esc(DT.t("resultWord")), f:r=> DT.esc(DT.tx(rowText(r.row)))+(r.row.note?`<br><span class="sub">${DT.esc(DT.tx(r.row.note))}</span>`:"")}], t.conds ? weightFn(env) : undefined); }
      catch(e){ html = `<tr><td class="sub">${DT.esc(e.message)}</td></tr>`; }
      const cnt = t.count!==1 ? ` <span class="sub">× ${DT.esc(typeof t.count==="object" ? "…" : t.count)}</span>` : "";
      return `<details><summary>${DT.esc(DT.tx(t.title))} <span class="die">d${t.die}</span>${cnt}</summary>${notes.length?`<p class="sub">${DT.esc(DT.t("dependsOn",{what:notes.join(" · ")}))}</p>`:""}<div class="tscroll"><table class="ref">${html}</table></div></details>`;
    }).join("");
  }
  const tab = DT.registerTab({
    id:def.id, icon:def.icon, title:def.title, heading:def.heading, tagline:def.tagline, order:def.order, strings:def.strings,
    emptyLibraryKey:"noResults",
    mount(panel){
      panel.innerHTML = `<div class="controls">
          <div class="row" data-ref="ctx"></div>
          <div class="row" style="margin-top:12px">
            <button class="primary" data-ref="rollAll">${DT.esc(DT.t("rollAll"))}</button>
            <input type="text" data-ref="name" style="flex:1; min-width:160px">
            <button class="small" data-ref="nameDice" title="${DT.esc(DT.t("rollName"))}">🎲</button>
            <button class="small" data-ref="rename">${DT.esc(DT.t("renameBtn"))}</button>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="small" data-ref="copy">${DT.esc(DT.t("copyMdShort"))}</button>
            <button class="small host" data-ref="screen" hidden>${DT.esc(DT.t("toScreenShort"))}</button>
            <button class="small host" data-ref="article" hidden>${DT.esc(DT.t("toArticleShort"))}</button>
          </div></div>
        <div class="grid" style="margin-top:14px" data-ref="results"></div>
        <h2>${DT.esc(DT.t("savedTitle"))}</h2><div class="controls"><div class="savebar">
          <button data-ref="exportAll">${DT.esc(DT.t("exportAll"))}</button><button data-ref="import">${DT.esc(DT.t("importBtn"))}</button></div>
          <div data-ref="lib" style="margin-top:10px"></div></div>
        <h2>${DT.esc(DT.t("refTitle"))}</h2><div data-ref="refs"></div>`;
      refs = DT.refs(panel);
      refs.rollAll.onclick = ()=>{
        cur = {id:DT.uid(), tab:def.id, name:"", data:rollAll(selCtx())};
        cur.name = def.recordName ? (def.recordName(helpers(cur)) || newName()) : newName();
        persist(); render();
      };
      refs.nameDice.onclick = ()=>{ if(!cur || !def.recordName) return; tables.filter(t=> t.hidden).forEach(t=> rerollFrom(t.id, cur.data)); cur.name = def.recordName(helpers(cur)) || cur.name; persist(); render(); };
      const rename = ()=>{ const v=refs.name.value.trim(); if(cur && v){ cur.name=v; persist(); } };
      refs.rename.onclick = rename;
      refs.name.addEventListener("keydown", e=>{ if(e.key==="Enter") rename(); });
      refs.copy.onclick = ()=>{ if(cur) DT.copyText(markdown(cur, {dm:true})); };
      refs.screen.onclick = ()=>{ if(cur) DT.bridge.toScreen({label:cur.name, md:markdown(cur, {dm:true})}); };
      refs.article.onclick = async ()=>{
        if(!cur || !def.article) return;
        const res = await DT.bridge.toArticle(cur, def.article(cur, helpers(cur)));
        if(res && res.slug){ cur.links = Object.assign({}, cur.links, {article:res.slug}); persist(); DT.toast(DT.t("articleReady")); }
        else DT.toast(DT.t("articleNotMade"));
      };
      refs.exportAll.onclick = ()=>{ const l=DT.records.list(def.id); if(!l.length) return alert(DT.t("alertNothingToExport")); DT.io.exportMany(l, def.id); };
      refs.import.onclick = ()=> DT.io.pickFile();
      DT.library(refs.lib, def.id);
      const act = DT.records.active(def.id);
      cur = act ? normalize(act) : null;
      renderCtx(); render();
    },
    onShow(){ if(refs) render(); },
    onLang(){ if(refs){ const keep = selCtx(); refs.rollAll.textContent=DT.t("rollAll"); refs.rename.textContent=DT.t("renameBtn"); refs.copy.textContent=DT.t("copyMdShort");
      refs.screen.textContent=DT.t("toScreenShort"); refs.article.textContent=DT.t("toArticleShort"); renderCtx();
      refs.ctx.querySelectorAll("select[data-ctx]").forEach(s=>{ if(keep[s.dataset.ctx]!=null) s.value=keep[s.dataset.ctx]; }); render(); } },
    validate: data=> !!(data && data.rolls && typeof data.rolls==="object"),
    load(rec){ cur = normalize(rec); DT.records.setActive(def.id, rec.id); if(refs){ renderCtx(); render(); } DT.refreshLibraries(); },
    current: ()=> cur,
    onRemoved(rec){ if(cur && cur.id===rec.id){ cur=null; render(); } },
    summary(rec){
      normalize(rec);
      const shown = tables.filter(t=> !t.hidden && !t.dm).flatMap(t=> (rec.data.rolls[t.id]||[]).map(r=> resText(t, r))).filter(Boolean);
      return {chips: ctxDefs.map(c=> ctxText(rec.data, c.id)).filter(Boolean).slice(0,2), meta:[], detail: shown.slice(0,4).join(" · ")};
    },
    toMarkdown(rec, opts={}){ return markdown(normalize(JSON.parse(JSON.stringify(rec))), opts); }
  });
  // Para las pruebas y para quien extienda.
  tab.tables = tables; tab.context = ctxDefs;
  tab.api = {rollAll, rerollFrom, normalize, markdown, helpers, resText, weightFn, envFor, defaultCtx, current:()=>cur};
  return tab;
};

/* ===================== PUENTE CON VEIL ===================== */
// Protocolo (postMessage, mismo origen). Todos los mensajes llevan {ns:"dndtables", v:1, type}.
//   app → Veil   ready {app}   ·   upsert {record, title, summary}   ·   remove {id}
//                toScreen {card:{label, md, w, h}}   ·   toArticle {requestId, recordId, link, article}
//   Veil → app   init {world:{id,name}, lang, canEdit, caps, ok, records, ids}   ·   saved {id}
//                articleDone {requestId, recordId, slug}   ·   error {message}
DT.bridge = (function(){
  const NSP = "dndtables", V = 1;
  let synced = new Set(DT.storage.getJSON(SYNC_KEY, []));
  const saveSynced = ()=> DT.storage.setJSON(SYNC_KEY, [...synced]);
  const pending = new Map();
  const pushed = new Map();   // id → savedAt de lo último que se le mandó a Veil
  // Veil sirve la extensión desde su propio origen: solo se habla con un padre del MISMO origen.
  // (Desde file:// no hay origen que comprobar, así que ahí no se habla con nadie.)
  const ORIGIN = location.origin && location.origin!=="null" ? location.origin : null;
  function send(type, payload){
    if(!DT.host.embedded || !ORIGIN) return false;
    try{ window.parent.postMessage(Object.assign({ns:NSP, v:V, type}, payload||{}), ORIGIN); return true; }catch(e){ console.warn(e); return false; }
  }
  function docMeta(rec){
    const tab = DT.tabs.get(rec.tab); let s={chips:[],meta:[],detail:""};
    try{ if(tab && tab.summary) s = Object.assign(s, tab.summary(rec)); }catch(e){}
    return {title:rec.name, summary:[tab?DT.tx(tab.title):rec.tab, ...s.chips, ...s.meta].filter(Boolean).join(" · ")};
  }
  function pushUpsert(rec){
    if(!DT.host.connected || !DT.host.canEdit) return;
    send("upsert", Object.assign({record:rec}, docMeta(rec)));
    pushed.set(rec.id, rec.savedAt||0);
  }
  // Otra pestaña (p. ej. «Abrir aparte») cambió los datos: lo que Veil aún no tiene, se le manda.
  function resync(){
    synced = new Set(DT.storage.getJSON(SYNC_KEY, []));
    const all = DT.records.all(), ids = new Set(all.map(r=> r.id));
    for(const r of all) if(pushed.get(r.id)!==(r.savedAt||0)) pushUpsert(r);
    for(const id of [...synced]) if(!ids.has(id)){ send("remove", {id}); synced.delete(id); pushed.delete(id); }
    saveSynced();
  }
  // Mezcla lo del mundo con lo local. Gana el más reciente; "synced" dice si algo que falta de un
  // lado fue borrado (estaba sincronizado) o es nuevo (nunca llegó al otro lado).
  // allIds: los ids de TODOS los documentos del mundo, también los que quien mira no puede ver
  // (esos no llegan en worldRecs, pero existen: no son un borrado).
  function merge(worldRecs, allIds){
    synced = new Set(DT.storage.getJSON(SYNC_KEY, []));   // otra pestaña del mismo mundo pudo cambiarlo
    const world = new Map(); (worldRecs||[]).forEach(r=>{ if(r && r.id && r.tab && r.data) world.set(r.id, r); });
    const exists = new Set((Array.isArray(allIds)?allIds:[]).map(String)); world.forEach((_,id)=> exists.add(id));
    const local = new Map(DT.records.all().map(r=>[r.id, r]));
    const upload=[], removeWorld=[];
    for(const [id, w] of world){
      const l = local.get(id);
      if(!l){ if(synced.has(id)) removeWorld.push(id); else DT.records.upsert(w, {keepTime:true, fromHost:true}); }
      else if((w.savedAt||0) > (l.savedAt||0)) DT.records.upsert(w, {keepTime:true, fromHost:true});
      else if((l.savedAt||0) > (w.savedAt||0)) upload.push(l);
    }
    for(const [id, l] of local){
      if(exists.has(id)) continue;   // está en el mundo (visible o no): ya se trató arriba o no se toca
      if(synced.has(id)) DT.records.remove(id, {fromHost:true}); else upload.push(l);
    }
    synced = new Set([...exists].filter(id=> !removeWorld.includes(id)));
    saveSynced();
    return {upload, removeWorld};
  }
  function onMessage(e){
    if(e.source!==window.parent || !ORIGIN || e.origin!==ORIGIN) return;
    const m = e.data; if(!m || m.ns!==NSP || m.v!==V) return;
    if(m.type==="init"){
      DT.host.connected = true;
      DT.host.canEdit = m.canEdit!==false;
      DT.host.caps = Object.assign({}, m.caps||{});
      DT.host.worldName = (m.world && m.world.name) || DT.host.world;
      if(DT.storage.pref("lang")==null && (m.lang==="en"||m.lang==="es") && m.lang!==DT.lang) DT.setLang(m.lang);
      DT.host.readFailed = m.ok===false;
      if(DT.host.readFailed){
        // Veil no pudo leer el mundo: una lista vacía NO significa «todo se borró». Nada de mezclar
        // ni de escribir; lo de esta sesión queda en local y se sube la próxima vez que se abra.
        DT.host.canEdit = false;
        DT.toast(DT.t("hostReadFailed"), 5000);
      } else {
        const {upload, removeWorld} = merge(Array.isArray(m.records)?m.records:[], m.ids);
        DT.records.all().forEach(r=> pushed.set(r.id, r.savedAt||0));
        if(DT.host.canEdit){ upload.forEach(pushUpsert); removeWorld.forEach(id=> send("remove",{id})); }
      }
      DT.reloadActive();
      renderChrome();
    } else if(m.type==="saved" && m.id){ synced.add(m.id); saveSynced(); }
    else if(m.type==="articleDone"){ const cb=pending.get(m.requestId); pending.delete(m.requestId); cb && cb(m); }
    else if(m.type==="error"){ DT.toast("Veil: "+String(m.message||"error")); }
  }
  if(DT.host.embedded){
    window.addEventListener("message", onMessage);
    DT.records.onChange(ev=>{
      if(ev.opts && ev.opts.fromHost) return;
      if(ev.type==="upsert") pushUpsert(ev.rec);
      else if(ev.type==="remove" && DT.host.connected && DT.host.canEdit){ send("remove", {id:ev.rec.id}); synced.delete(ev.rec.id); pushed.delete(ev.rec.id); saveSynced(); }
      else if(ev.type==="external" && DT.host.connected && DT.host.canEdit) resync();
    });
  }
  return {
    send,
    hello(){ send("ready", {app:{name:"dndtables", version:DT.VERSION, schema:DT.SCHEMA, tabs:DT.tabList().map(t=>({id:t.id, title:t.title, icon:t.icon||""}))}}); },
    toScreen(card){ if(send("toScreen", {card})) DT.toast(DT.t("hostSent")); },
    toArticle(rec, article){
      return new Promise(ok=>{
        const requestId = DT.uid("q"); pending.set(requestId, ok);
        send("toArticle", {requestId, recordId:rec.id, link:(rec.links&&rec.links.article)||"", article});
        setTimeout(()=>{ if(pending.has(requestId)){ pending.delete(requestId); ok(null); } }, 120000);
      });
    },
    merge   // expuesto para las pruebas
  };
})();
function renderHostBar(){
  const hb = document.getElementById("hostBar");
  if(!DT.host.embedded || !DT.host.connected){ hb.hidden = true; return; }
  hb.hidden = false;
  hb.textContent = DT.host.readFailed ? DT.t("hostReadFailed") : DT.host.canEdit ? DT.t("hostConnected",{world:DT.host.worldName||DT.host.world}) : DT.t("hostReader");
}
// La pestaña visible vuelve a leer su resultado activo (tras sincronizar con Veil o importar).
DT.reloadActive = function(){
  for(const t of DT.tabs.values()){ if(!t._mounted) continue; const r = DT.records.active(t.id); try{ if(r && t.load) t.load(r); else t.onShow && t.onShow(); }catch(e){ console.error(e); } }
  DT.refreshLibraries();
};

/* ===================== ARRANQUE ===================== */
DT.start = function(){
  if(DT.started) return; DT.started = true;
  document.documentElement.lang = DT.lang;
  DT.applyI18n(document);
  document.getElementById("clearLog").onclick=()=>{ document.getElementById("logList").innerHTML=`<div class="l logempty">${DT.esc(DT.t("logEmpty"))}</div>`; };
  document.getElementById("langToggle").onclick=()=> DT.setLang(DT.lang==="en"?"es":"en");
  document.getElementById("appVersion").textContent = "D&D Tables v"+DT.VERSION;
  const wanted = DT.params.get("tab") || (location.hash.match(/^#tab=([a-z0-9-]+)/)||[])[1] || DT.storage.pref("tab");
  DT.showTab(DT.tabs.has(wanted) ? wanted : (DT.tabList()[0]||{}).id);
  if(DT.host.embedded){
    DT.bridge.hello();
    setTimeout(()=>{ if(!DT.host.connected) console.info("[dndtables] "+DT.t("hostOffline")); }, 4000);
  }
};
</script>

/* ===================== AYUDAS DE IDIOMA ===================== */
const en = ()=> DT.lang==="en";
function tv(n){ return en()?(VEN_EN[n]||n):n; }
function ti(n){ return en()?(ITM_EN[n]||n):n; }
function tc(c){ return en()?(CAT_EN[c]||c):c; }
function vName(key){ return CATALOG[key] ? tv(CATALOG[key].name) : String(key); }
function fmtPop(p){ return en()? p.replace(/\./g,",") : p; }
function sizeName(s){ return en()? s.en.name : s.name; }
function sizeSub(s){ return en()? s.en.sub : s.sub; }
function priceLbl(t){ return en()? t.en : t.label; }
function tierByFactor(f){ return PRICE_TIERS.find(t=>Math.abs(t.f-f)<0.001) || PRICE_TIERS[3]; }
const pct = f => (f>0?"+":"−")+Math.round(Math.abs(f)*100)+"%";
const signed = n => (n>0?"+":n<0?"−":"±")+Math.abs(n);

/* ===================== ESTADO ===================== */

/* ===================== TABLAS Y PESOS ===================== */
function sizeIndex(sz){ return SIZES.indexOf(sz)+1; }
function sizeOf(key){ return SIZES.find(s=>s.key===key) || null; }
function travelLabel(t){ const [c,d,m]=t; return DT.diceLabel(c,d,m); }
function availableVariety(sz){ const idx=sizeIndex(sz); return VARIETY_KEYS.filter(k=> (CATALOG[k].from||1) <= idx); }
function priceTier(roll){ return PRICE_TIERS.find(t=> roll>=t.r[0] && roll<=t.r[1]); }
function stateRow(d){ return (d && d.state && STATES.byId(d.state.id)) || STATES.byId("normal"); }
function eventRow(d){ return (d && d.event && EVENTS.byId(d.event.id)) || EVENTS.byId("quiet"); }
function varietyWeight(key, idx){ const w=VENDOR_W[key]||{w:1}; return w.w*(1+(w.grow||0)*Math.max(0, idx-(CATALOG[key].from||1))); }
function travelWeight(key, st, ev){
  const mul = o=> (o && o.weights && o.weights[key]!=null) ? o.weights[key] : 1;
  return (VENDOR_W[key]||{w:1}).w * mul(st) * mul(ev);
}
function varietyTable(sz){
  const idx = sizeIndex(sz), pool = availableVariety(sz);
  return {pool, table: DT.table({id:"variety-"+sz.key, die:100, rows:pool.map(k=>({key:k}))}), wf: r=> varietyWeight(r.key, idx)};
}
const TRAVEL_T = DT.table({id:"travel", die:100, rows:TRAVEL_KEYS.map(k=>({key:k}))});
const travelWF = (st, ev)=> r=> travelWeight(r.key, st, ev);

/* ===================== PRECIOS Y REGATEO ===================== */
function attitudeOf(v){ return v.npc ? ATTITUDE.lookup(v.npc.att).row : null; }
function effHaggle(v, d){
  const c=CATALOG[v.key], att=attitudeOf(v), st=stateRow(d), ev=eventRow(d);
  const dc = c.haggle.dc + (att?att.dc:0) + (st.dc||0) + ((ev.dcKey && ev.dcKey[v.key])||0);
  return {dc, base:c.haggle.dc, max:Math.min(0.5, c.haggle.max + (st.max||0))};
}
// devuelve {disc, note, cls}
function haggleResult(v, total, d){
  const h = effHaggle(v, d);
  if(total===null || total==="" || total===undefined || isNaN(total)) return {disc:0, note:"", cls:""};
  total=Number(total);
  if(total <= h.dc-5){
    const note = en() ? "Fail by 5+. The vendor takes offense: prices +10%." : "Fallo por 5+. El vendedor se ofende: precios +10%.";
    return {disc:-0.10, note, cls:"bad"};
  }
  if(total < h.dc){
    const note = en() ? `Doesn't meet DC ${h.dc}. No discount.` : `No alcanza la CD ${h.dc}. Sin descuento.`;
    return {disc:0, note, cls:""};
  }
  const over = total - h.dc;
  const disc = Math.min(0.05 + Math.floor(over/3)*0.05, h.max);
  const p = Math.round(disc*100);
  const capped = disc>=h.max ? (en()?" (cap reached)":" (tope alcanzado)") : "";
  const note = en() ? `Deal! ${p}% discount${capped}.` : `¡Trato! Descuento del ${p}%${capped}.`;
  return {disc, note, cls:"good"};
}
// Multiplicador por categoría: estado del asentamiento × evento de la semana.
function catMult(cat, d){
  const f = o=> (1+((o&&o.all)||0)) * (1+((o&&o[cat])||0));
  return f(stateRow(d).price) * f(eventRow(d).price);
}
function vendorMult(v, d){
  const hag = haggleResult(v, v.hagRoll, d);
  const comp = v.comp>1 ? 0.9*(eventRow(d).compExtra||1) : 1;
  return v.factor * comp * (1-hag.disc) * catMult(CATALOG[v.key].cat, d);
}
function stockLevel(v, i){ const n = v.stock ? v.stock[i] : STOCK_NORMAL; return (Number.isInteger(n) && n>=0 && n<STOCK.rows.length) ? n : STOCK_NORMAL; }
function specialOf(v){
  if(!v.special || v.special.roll==null) return null;
  const tb = SPECIAL_T[CATALOG[v.key].cat]; if(!tb) return null;
  const hit = tb.lookup(v.special.roll); return hit ? hit.row : null;
}

/* ===================== TIRADAS ===================== */
function rollNpc(){
  const a = ANCESTRY.roll();
  const names = a.row.names;
  return {anc:a.row.id, name:names[DT.rollDie(names.length)-1], trait:DT.rollDie(20), quirk:DT.rollDie(12), att:DT.rollDie(6), rumor:DT.rollDie(20), truth:DT.rollDie(6)};
}
function stockMod(cat, d){
  const st=stateRow(d), ev=eventRow(d);
  const g = o=> ((o&&o.all)||0) + ((o&&o[cat])||0);
  return g(st.stock) + g(ev.stock);
}
function rollStock(key, d, extra=0){
  const c = CATALOG[key], mod = stockMod(c.cat, d) + extra;
  return c.goods.map(item=>{
    if(isService(item)) return STOCK_NORMAL;
    const n = Math.min(6, Math.max(1, DT.rollDie(6)+mod));
    return STOCK.rows.indexOf(STOCK.lookup(n).row);
  });
}
function rollSpecial(key, force){
  const tb = SPECIAL_T[CATALOG[key].cat]; if(!tb) return null;
  const chance = DT.rollDie(6);
  if(!force && chance < SPECIAL_MIN) return {chance, roll:null};
  return {chance, roll:tb.roll().roll};
}
function logGoods(v){
  const out = (v.stock||[]).filter(n=>n===0).length, low = (v.stock||[]).filter(n=>n===1).length;
  const sp = specialOf(v);
  const parts = [];
  if(out) parts.push(L("soldOutN",{n:out}));
  if(low) parts.push(L("lowN",{n:low}));
  if(sp) parts.push(L("specialLog",{item:tx(sp)}));
  if(parts.length) DT.log("d6", "", `${vName(v.key)} · ${parts.join(", ")}`);
}
function logNpc(v){
  if(!v.npc) return;
  const a = ANCESTRY.byId(v.npc.anc), att = attitudeOf(v);
  DT.log("NPC", "", `${vName(v.key)}: ${v.npc.name} (${tx(a.name)}) · ${att.emoji} ${tx(att.name)}`);
}
function makeVendor(key, tier, d, opts={}){
  const roll = DT.rollDie(12), t = priceTier(roll);
  DT.log("d12", roll, `${vName(key)}: ${priceLbl(t)}`);
  const v = {key, tier, factor:t.f, priceLabel:t.label, comp:0, hagRoll:null, npc:rollNpc(), stock:rollStock(key, d), special:rollSpecial(key, !!opts.special)};
  logNpc(v); logGoods(v);
  return v;
}
function rollState(){
  const r = STATES.roll();
  DT.log("d20", r.roll, `${L("stateTitle")}: ${r.row.icon} ${tx(r.row.name)}`);
  return {id:r.row.id, roll:r.roll};
}
function rollEvent(week){
  const r = EVENTS.roll();
  DT.log("d20", r.roll, `${L("eventTitle",{n:week})}: ${r.row.icon} ${tx(r.row.name)}`);
  return {id:r.row.id, roll:r.roll};
}

/* ===================== GENERACIÓN ===================== */
function newRecord(){
  return {id:DT.uid("c"), tab:"vendors", name:randomName(), data:{v:3, sizeKey:selectedSize.key, week:1, state:null, event:null, permanent:[], traveling:[]}};
}
function genPermanent(d){
  const sz = sizeOf(d.sizeKey) || selectedSize;
  const perm = sz.core.map(k=> makeVendor(k, "basic", d));
  const {pool, table, wf} = varietyTable(sz);
  const chosen = [];
  let attempts = 0;
  while(chosen.length < sz.variety && pool.length>0 && attempts<120){
    attempts++;
    const r = table.roll(wf); if(!r) break;
    const k = r.row.key;
    if(chosen.includes(k) || sz.core.includes(k)){ DT.log("d100", r.roll, `${vName(k)} (${L("dupReroll")})`); continue; }
    chosen.push(k);
    DT.log("d100", r.roll, vName(k));
  }
  chosen.forEach(k=> perm.push(makeVendor(k, "variety", d)));
  d.permanent = perm;
}
// Ambulantes de la semana: cuántos (dado del tamaño + estado + evento), quiénes (d100 con pesos), y lo que haga el evento.
function genTravelers(d){
  const sz = sizeOf(d.sizeKey) || selectedSize;
  const st = stateRow(d), ev = eventRow(d), evd = d.event || {};
  const [c,dd,m] = sz.travel;
  const base = DT.rollDice(c,dd,m);
  let count = base.total + (st.travel||0);
  if(ev.extra){ const x=DT.parseDice(ev.extra); const r=DT.rollDice(x.count, x.die, x.mod); evd.extra=r.total; count+=r.total; if(x.count) DT.log(ev.extra, r.total, `${ev.icon} ${tx(ev.name)}`); }
  if(ev.less){ const x=DT.parseDice(ev.less); const r=DT.rollDice(x.count, x.die, x.mod); evd.less=r.total; count-=r.total; DT.log(ev.less, r.total, `${ev.icon} ${tx(ev.name)}`); }
  count = Math.max(0, count);
  DT.log(travelLabel(sz.travel), base.total, `${base.rolls.join("+")}${m?(m>0?"+"+m:m):""}${st.travel?" "+signed(st.travel):""} → ${count} ${L("travellersWord")}`);
  const wf = travelWF(st, ev);
  let trav = [];
  for(let i=0;i<count;i++){
    let key;
    if(i===0 && ev.force){ key = ev.force; DT.log("—", "", `${ev.icon} ${vName(key)}`); }
    else { const r = TRAVEL_T.roll(wf); key = r.row.key; DT.log("d100", r.roll, vName(key)); }
    trav.push(makeVendor(key, "travel", d, {special: ev.special && i===count-1}));
  }
  if(ev.special && trav.length) evd.target = {key:trav[trav.length-1].key, tier:"travel"};
  if(ev.remove){
    const gone = [...new Set(trav.filter(v=> ev.remove.includes(v.key)).map(v=>v.key))];
    evd.removed = gone;
    trav = trav.filter(v=> !ev.remove.includes(v.key));
  }
  d.traveling = trav;
  d.event = evd;
}
// Efectos del evento que tocan a un vendedor concreto (robo, subasta).
function applyEventTargets(d){
  const ev = eventRow(d), evd = d.event || {};
  if(ev.theft){
    const all = [...d.permanent, ...d.traveling];
    if(all.length){ const i = DT.rollDie(all.length)-1, v = all[i]; v.stock = rollStock(v.key, d, -2); evd.target = {key:v.key, tier:v.tier}; DT.log("d"+all.length, i+1, `${ev.icon} ${vName(v.key)}`); }
  }
  if(ev.specialPerm && d.permanent.length){
    const i = DT.rollDie(d.permanent.length)-1, v = d.permanent[i];
    v.special = rollSpecial(v.key, true); evd.target = {key:v.key, tier:v.tier};
    DT.log("d"+d.permanent.length, i+1, `${ev.icon} ${vName(v.key)}: ${tx(specialOf(v))}`);
  }
}
// Competencia: misma categoría entre vendedores presentes → −10%
function applyCompetition(d){
  if(!d) return;
  const all=[...(d.permanent||[]),...(d.traveling||[])];
  const counts={};
  all.forEach(v=>{ const cat=CATALOG[v.key].cat; counts[cat]=(counts[cat]||0)+1; });
  all.forEach(v=>{ const cat=CATALOG[v.key].cat; v.comp = counts[cat]>1 ? counts[cat] : 0; });
}

const int = (n, lo, hi, fb)=>{ n = parseInt(n,10); return (isNaN(n) || n<lo || n>hi) ? fb : n; };
function normNpc(n){
  if(!n || typeof n!=="object") return null;
  return {anc: ANCESTRY.byId(n.anc) ? n.anc : "human", name: String(n.name==null?"?":n.name).slice(0,60),
    trait:int(n.trait,1,20,1), quirk:int(n.quirk,1,12,1), att:int(n.att,1,6,3), rumor:int(n.rumor,1,20,1), truth:int(n.truth,1,6,3)};
}
function normVendor(v, tier){
  if(!v || !CATALOG[v.key]) return null;
  const goods = CATALOG[v.key].goods.length;
  return {key:v.key, tier:["basic","variety","travel"].includes(v.tier)?v.tier:tier,
    factor: Number(v.factor)>0 ? Number(v.factor) : 1, priceLabel: v.priceLabel, comp:0,
    hagRoll: (v.hagRoll===""||v.hagRoll==null) ? null : v.hagRoll,
    npc: normNpc(v.npc),
    stock: Array.isArray(v.stock) ? Array.from({length:goods}, (_,i)=> int(v.stock[i],0,STOCK.rows.length-1,STOCK_NORMAL)) : null,
    special: (v.special && typeof v.special==="object") ? {chance:int(v.special.chance,1,6,null), roll:int(v.special.roll,1,6,null)} : null};
}
// Deja cualquier resultado (v2 incluido) con la forma v3. Lo que falte, se da por "normal".
function normalize(rec){
  const d = rec.data;
  d.permanent = (Array.isArray(d.permanent)?d.permanent:[]).map(v=>normVendor(v,"variety")).filter(Boolean);
  d.traveling = (Array.isArray(d.traveling)?d.traveling:[]).map(v=>normVendor(v,"travel")).filter(Boolean);
  d.state = (d.state && STATES.byId(d.state.id)) ? {id:d.state.id, roll:int(d.state.roll,1,20,null)} : null;
  if(d.event && EVENTS.byId(d.event.id)){
    const e = d.event;
    d.event = {id:e.id, roll:int(e.roll,1,20,null), extra:int(e.extra,0,99,undefined), less:int(e.less,0,99,undefined),
      removed:Array.isArray(e.removed)?e.removed.filter(k=>CATALOG[k]):undefined,
      target:(e.target && CATALOG[e.target.key])?{key:e.target.key, tier:String(e.target.tier||"")}:undefined};
  } else d.event = null;
  d.week = int(d.week,1,9999,1);
  d.v = 3;
  applyCompetition(d);
  return rec;
}
