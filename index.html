/* ===================== FICHAS ===================== */
function fxChips(row, kind){
  const out = [];
  for(const [k,v] of Object.entries(row.price||{})) out.push({t:`${k==="all"?L("fxAll"):tc(k)} ${pct(v)}`, cls:v>0?"bad":"good"});
  for(const [k,v] of Object.entries(row.stock||{})) out.push({t:`${L("fxStock")} ${k==="all"?L("fxAll"):tc(k)} ${signed(v)}`, cls:v>0?"good":"bad"});
  if(row.travel) out.push({t:L("fxTravel",{n:signed(row.travel)}), cls:""});
  if(row.dc) out.push({t:L("fxDC",{n:signed(row.dc)}), cls:"bad"});
  if(row.max) out.push({t:L("fxMax",{n:Math.round(row.max*100)}), cls:"good"});
  const w = Object.entries(row.weights||{});
  const more = w.filter(([,m])=>m>1).map(([k,m])=>`${vName(k)} ×${m}`), fewer = w.filter(([,m])=>m>0&&m<1).map(([k])=>vName(k)), none = w.filter(([,m])=>m===0).map(([k])=>vName(k));
  if(more.length) out.push({t:L("fxMore",{list:more.join(", ")}), cls:""});
  if(fewer.length) out.push({t:L("fxFewer",{list:fewer.join(", ")}), cls:""});
  if(none.length) out.push({t:L("fxNo",{list:none.join(", ")}), cls:""});
  if(kind==="event"){
    if(row.extra) out.push({t:L("fxExtra",{d:row.extra}), cls:""});
    if(row.less) out.push({t:L("fxLess",{d:row.less}), cls:""});
    if(row.remove) out.push({t:L("fxFlee",{list:row.remove.map(vName).join(", ")}), cls:""});
    if(row.theft) out.push({t:L("fxTheft"), cls:"bad"});
    if(row.compExtra) out.push({t:L("fxCompExtra"), cls:"good"});
    if(row.special) out.push({t:L("fxSpecial"), cls:"good"});
    if(row.specialPerm) out.push({t:L("fxAuction"), cls:"good"});
    for(const [k,n] of Object.entries(row.dcKey||{})) out.push({t:L("fxDcKey",{vendor:vName(k), n}), cls:"bad"});
  }
  return out;
}
const chipsHTML = list => list.length ? list.map(c=>`<span class="vtag ${c.cls==="bad"?"bad":c.cls==="good"?"good":"mod"}">${esc(c.t)}</span>`).join("") : `<span class="vtag">${esc(L("fxNone"))}</span>`;
const chipsText = list => list.length ? list.map(c=>c.t).join(" · ") : L("fxNone");
// Lo que el evento hizo de verdad esta semana (dados ya tirados).
function eventResolved(d){
  const ev = eventRow(d), e = d.event || {}, out = [];
  if(e.extra) out.push({t:L("evExtra",{n:e.extra}), cls:"good"});
  if(e.less) out.push({t:L("evLess",{n:e.less}), cls:"bad"});
  if(ev.remove) out.push(e.removed && e.removed.length ? {t:L("evFled",{list:e.removed.map(vName).join(", ")}), cls:"bad"} : {t:L("evNobodyFled"), cls:""});
  if(e.target && ev.theft) out.push({t:L("evTheft",{vendor:vName(e.target.key)}), cls:"bad"});
  if(e.target && ev.specialPerm) out.push({t:L("evAuction",{vendor:vName(e.target.key)}), cls:"good"});
  if(e.target && ev.special) out.push({t:L("evNewcomer",{vendor:vName(e.target.key)}), cls:"good"});
  return out;
}

function vendorCard(v, id){

function settlementMarkdown(rec, opts={}){
  const d = rec.data, s = sizeOf(d.sizeKey), st = stateRow(d), ev = eventRow(d);
  const lines = [];
  if(!opts.noTitle) lines.push(`### ${md(rec.name)}`, "");
  lines.push(`*${s?md(sizeName(s)):md(d.sizeKey)}${s?` · 👥 ${fmtPop(s.pop)}`:""} · ${L("weekWord")} ${d.week||1}*`, "");
  lines.push(`**${L("stateTitle")}:** ${st.icon} ${md(tx(st.name))} — ${md(chipsText(fxChips(st,"state")))}  `);
  const res = eventResolved(d);
  lines.push(`**${L("eventTitle",{n:d.week||1})}:** ${ev.icon} ${md(tx(ev.name))} — ${md(res.length?chipsText(res):tx(ev.desc))}`, "");
  const head = `| ${L("colVendor")} | ${L("mdShopkeeper")} | ${L("colHaggle")} | ${L("mdPrices")} | ${L("special")} |\n|---|---|---|---|---|`;
  lines.push(head, ...d.permanent.map(v=> vendorRowMd(v, d)));
  if(d.traveling.length) lines.push(...d.traveling.map(v=> vendorRowMd(v, d).replace(/^\| /, "| 🐎 ")));
  const rum = [...d.permanent, ...d.traveling].filter(v=> v.npc);
  if(rum.length){
    lines.push("", `**${L("mdRumors")}**`);
    rum.forEach(v=>{ const t = TRUTH.lookup(v.npc.truth).row; lines.push(`- ${md(v.npc.name)} (${md(vName(v.key))}): «${md(tx(RUMOR.lookup(v.npc.rumor).row.text))}»${opts.dm?` — *${L("dmOnly")}: ${md(tx(t.name))}*`:""}`); });
  }
  return lines.join("\n")+"\n";
}
function vendorMarkdown(v, d, dm){
  const c = CATALOG[v.key], mult = vendorMult(v, d), h = effHaggle(v, d), sp = specialOf(v);
  const lines = [`### ${c.icon} ${md(vName(v.key))}`, "", npcLine(v)];
  if(v.npc){
    lines.push(`*${md(tx(TRAIT.lookup(v.npc.trait).row.text))} · ${md(tx(QUIRK.lookup(v.npc.quirk).row.text))}*`);
    const t = TRUTH.lookup(v.npc.truth).row;
    lines.push(`🗣 «${md(tx(RUMOR.lookup(v.npc.rumor).row.text))}»${dm?` — *${L("dmOnly")}: ${md(tx(t.name))}*`:""}`);
  }
  lines.push("", `**${L("dcPersuasion")} ${h.dc}** · ${L("maxDisc")} ${Math.round(h.max*100)}%`, "", `| ${L("colItem")} | ${L("colHere")} |`, "|---|---|");
  if(sp) lines.push(`| ★ ${md(tx(sp))} | ${DT.money(sp.cp*mult)} |`);
  c.goods.forEach((item,i)=>{
    const lvl = STOCK.rows[stockLevel(v,i)];
    const price = item.cp<=0 ? "—" : (lvl.id==="out" ? `~~${DT.money(item.cp)}~~ (${tx(lvl.name)})` : DT.money(item.cp*mult*lvl.mult)+(lvl.cls?` (${tx(lvl.name)})`:""));
    lines.push(`| ${md(ti(item.name))} | ${price} |`);
  });
  return lines.join("\n")+"\n";
}
function articlePayload(rec){
  const d = rec.data, s = sizeOf(d.sizeKey), sName = s?sizeName(s):d.sizeKey;
  const body = settlementMarkdown(rec, {noTitle:true, dm:false});
  return {title:rec.name, template:"settlement", fields:{kind:sName, population:s?fmtPop(s.pop):""},
    subtitle:`${sName}${s?" · "+fmtPop(s.pop):""}`, summary:`${sName} · ${d.permanent.length+d.traveling.length} ${L("vendorsWord")}`,
    marker:"🛒", section:"econom", block:`:::nota ${L("marketLabel")}\n${body.replace(/^:::.*$/gm, "")}\n:::`};
}

function citySummary(rec){

}

(function(){

const PAY = DT.table({id:"job-pay", die:6, rows:[
  {lo:1, hi:1, mult:.5, text:{es:"La mitad, más un favor", en:"Half, plus a favor"}},
  {lo:2, hi:4, mult:1, text:{es:"Lo acordado", en:"As agreed"}},
  {lo:5, hi:5, mult:1.5, text:{es:"Generosa", en:"Generous"}},
  {lo:6, hi:6, mult:2, text:{es:"Espléndida, más un objeto", en:"Lavish, plus an item"}}]});
const TIERS = [
  {id:"t1", dice:[2,4,10], text:{en:"Levels 1–4", es:"Niveles 1–4"}}, {id:"t2", dice:[2,6,50], text:{en:"Levels 5–10", es:"Niveles 5–10"}},
  {id:"t3", dice:[2,6,250], text:{en:"Levels 11–16", es:"Niveles 11–16"}}, {id:"t4", dice:[2,6,1000], text:{en:"Levels 17–20", es:"Niveles 17–20"}}];
const COUNT = {troupe:[1,2,0], hamlet:[1,2,0], village:[1,3,0], town:[1,4,0], city:[1,4,1], largeCity:[1,6,1], metropolis:[2,4,0], megalopolis:[2,4,2]};
const SIZES = ()=> DT.lib.SIZES || [];
const sizeText = key=>{ const s = SIZES().find(x=> x.key===key); return s ? (DT.lang==="en" ? s.en.name : s.name) : key; };
const tierOf = id=> TIERS.find(t=> t.id===id) || TIERS[0];
const T = (table, roll)=> { const h = table.lookup(roll); return h ? tx(h.row.text!=null ? h.row.text : h.row.name) : "?"; };   // las tablas compartidas usan text o name
const gp = n=> Number(n).toLocaleString(DT.lang==="en"?"en":"es")+(DT.lang==="en"?" gp":" po");

// Tenderos (con rumor) de una ciudad guardada en Vendedores.
function shopkeepers(cityId){
  const rec = cityId && DT.records.get(cityId); if(!rec || rec.tab!=="vendors") return [];
  const V = DT.tabs.get("vendors"); if(!V || !V.api) return [];
  return [...(rec.data.permanent||[]), ...(rec.data.traveling||[])].filter(v=> v && v.npc && V.api.CATALOG[v.key])
    .map(v=> ({name:String(v.npc.name), vendor:v.key, rumor:v.npc.rumor, truth:v.npc.truth}));
}
function rollJob(tier, shops, fromRumor){
  const t = tierOf(tier), base = DT.rollDice(t.dice[0], t.dice[1]).total * t.dice[2];
  const j = {patron:PATRON.roll().roll, task:TASK.roll().roll, where:WHERE.roll().roll, comp:COMP.roll().roll, deadline:DEADLINE.roll().roll, pay:PAY.roll().roll, base};
  if(shops.length){
    if(fromRumor){ const s = shops[DT.rollDie(shops.length)-1]; j.shop = s; j.rumorJob = true; }
    else if(DT.rollDie(6)<=2){ j.shop = shops[DT.rollDie(shops.length)-1]; }
  }
  DT.log("📜", "", `${j.shop ? j.shop.name : T(PATRON, j.patron)}: ${j.rumorJob ? L("jobs.rumorTask") : T(TASK, j.task)} · ${gp(reward(j))}`);
  return j;
}
function reward(j){ const p = PAY.lookup(j.pay); return Math.round(j.base * (p ? p.row.mult : 1)); }
function vendorName(key){ const V = DT.tabs.get("vendors"); return V && V.api && V.api.vName ? V.api.vName(key) : key; }
function patronText(j){ return j.shop ? `${j.shop.name} (${vendorName(j.shop.vendor)})` : T(PATRON, j.patron); }
function taskText(j){ return j.rumorJob ? `${L("jobs.rumorTask")}: «${T(DT.lib.npc.RUMOR, j.shop.rumor)}»` : T(TASK, j.task); }

let cur = null, refs = null;
function newBoard(){
  const sel = refs.where.value, tier = refs.tier.value;
  const city = sel.startsWith("city:") ? DT.records.get(sel.slice(5)) : null;
  const size = city ? city.data.sizeKey : sel.slice(5);
  const [c,d,m] = COUNT[size] || [1,4,0];
  const n = Math.max(1, DT.rollDice(c,d,m).total);
  DT.log(DT.diceLabel(c,d,m), n, L("jobs.countLog"));
  const shops = city ? shopkeepers(city.id) : [];
  const jobs = []; for(let i=0;i<n;i++) jobs.push(rollJob(tier, shops, i===0 && shops.length>0));
  const name = `${L("jobs.board")} · ${city ? city.name : sizeText(size)}`;
  cur = {id:DT.uid(), tab:"jobs", name, data:{v:1, size, city:city?{id:city.id, name:city.name}:null, tier, jobs}};
  persist(); render();
}
function persist(){ if(cur){ DT.records.setActive("jobs", cur.id); DT.records.upsert(cur); } }
function jobMarkdown(j, i, dm){
  const lines = [`**${L("jobs.job")} ${i+1}** — ${md(taskText(j))}`, `- ${L("jobs.patron")}: ${md(patronText(j))}`, `- ${L("jobs.where")}: ${md(T(WHERE, j.where))}`,
    `- ${L("jobs.deadline")}: ${md(T(DEADLINE, j.deadline))}`, `- ${L("jobs.reward")}: ${gp(reward(j))} (${md(T(PAY, j.pay))})`];
  if(dm){ lines.push(`- ${L("jobs.comp")} (DM): ${md(T(COMP, j.comp))}`); if(j.rumorJob) lines.push(`- ${L("jobs.truth")} (DM): ${md(T(DT.lib.npc.TRUTH, j.shop.truth))}`); }
  return lines.join("\n");
}
function boardMarkdown(rec, opts={}){
  const d = rec.data;
  return `### ${md(rec.name)}\n\n*${md(d.city ? d.city.name+" · " : "")}${md(sizeText(d.size))} · ${md(tx(tierOf(d.tier).text))}*\n\n` +
    d.jobs.map((j,i)=> jobMarkdown(j, i, !!opts.dm)).join("\n\n") + "\n";
}
function renderSelectors(){
  const keepW = refs.where.value, keepT = refs.tier.value;
  const cities = DT.records.list("vendors").slice().sort((a,b)=> (a.name||"").localeCompare(b.name||"", DT.lang));
  refs.where.innerHTML = (cities.length ? `<optgroup label="${esc(L("jobs.savedCities"))}">${cities.map(c=>`<option value="city:${esc(c.id)}">🏙 ${esc(c.name)} (${esc(sizeText(c.data.sizeKey))})</option>`).join("")}</optgroup>` : "") +
    `<optgroup label="${esc(L("jobs.anySize"))}">${Object.keys(COUNT).map(k=>`<option value="size:${esc(k)}">${esc(sizeText(k))}</option>`).join("")}</optgroup>`;
  refs.tier.innerHTML = TIERS.map(t=>`<option value="${t.id}">${esc(tx(t.text))}</option>`).join("");
  const want = cur ? (cur.data.city ? "city:"+cur.data.city.id : "size:"+cur.data.size) : keepW;
  if(want && refs.where.querySelector(`option[value="${CSS.escape(want)}"]`)) refs.where.value = want; else if(!keepW) refs.where.value = "size:town";
  refs.tier.value = cur ? cur.data.tier : (keepT || "t1");
}
function render(){
  if(!refs) return;
  refs.shareRow.hidden = !cur;
  refs.screen.hidden = !(cur && DT.host.caps.toScreen);
  if(document.activeElement!==refs.name) refs.name.value = cur ? cur.name : "";
  refs.cards.innerHTML = !cur ? `<div class="empty">${esc(L("jobs.empty"))}</div>` : cur.data.jobs.map((j,i)=>`
    <div class="rcard" data-i="${i}">
      <div class="row" style="justify-content:space-between"><span class="rt">📜 ${esc(L("jobs.job"))} ${i+1}</span><span class="vtag mod">${esc(gp(reward(j)))}</span></div>
      <div class="rv"><b>${esc(taskText(j))}</b></div>
      <div class="sub">${esc(L("jobs.patron"))}: ${esc(patronText(j))}${j.rumorJob?` <span class="vtag var">🗣 ${esc(L("jobs.fromRumor"))}</span>`:""}</div>
      <div class="sub">${esc(L("jobs.where"))}: ${esc(T(WHERE, j.where))} · ${esc(L("jobs.deadline"))}: ${esc(T(DEADLINE, j.deadline))}</div>
      <div class="sub">${esc(L("jobs.reward"))}: ${esc(T(PAY, j.pay))}</div>
      <div class="note bad">${esc(L("jobs.comp"))} (DM): ${esc(T(COMP, j.comp))}${j.rumorJob?` · ${esc(L("jobs.truth"))}: ${esc(T(DT.lib.npc.TRUTH, j.shop.truth))}`:""}</div>
      <div class="vactions"><button class="small" data-act="reroll">${esc(L("jobs.rerollJob"))}</button></div>
    </div>`).join("");
  refs.cards.querySelectorAll(".rcard").forEach(card=>{
    card.querySelector('[data-act="reroll"]').onclick = ()=>{
      const i = +card.dataset.i, old = cur.data.jobs[i];
      const shops = cur.data.city ? shopkeepers(cur.data.city.id) : [];
      cur.data.jobs[i] = rollJob(cur.data.tier, shops, !!old.rumorJob && shops.length>0);
      persist(); render();
    };
  });
  renderRefs();
}
function renderRefs(){
  const col = [{h:esc(L("resultWord")), f:r=> esc(tx(r.row.text))}];
  const one = (title, table, cols)=> `<details><summary>${esc(title)} <span class="die">d${table.die}</span></summary><div class="tscroll"><table class="ref">${DT.refTableHTML(table, cols||col)}</table></div></details>`;
  refs.refs.innerHTML =
    `<details><summary>${esc(L("jobs.howMany"))}</summary><div class="tscroll"><table class="ref"><tr><th>${esc(L("jobs.settlement"))}</th><th>${esc(L("jobs.jobsWord"))}</th></tr>${
      Object.entries(COUNT).map(([k,[c,d,m]])=>`<tr><td>${esc(sizeText(k))}</td><td><span class="die">${DT.diceLabel(c,d,m)}</span></td></tr>`).join("")}</table></div></details>` +
    `<details><summary>${esc(L("jobs.reward"))}</summary><div class="tscroll"><table class="ref"><tr><th>${esc(L("jobs.level"))}</th><th>${esc(L("jobs.base"))}</th></tr>${
      TIERS.map(t=>`<tr><td>${esc(tx(t.text))}</td><td><span class="die">${t.dice[0]}d${t.dice[1]} × ${t.dice[2]}</span> ${DT.lang==="en"?"gp":"po"}</td></tr>`).join("")}</table></div></details>` +
    one(L("jobs.patron"), PATRON) + one(L("jobs.task"), TASK) + one(L("jobs.where"), WHERE) + one(L("jobs.comp"), COMP) + one(L("jobs.deadline"), DEADLINE) +
    one(L("jobs.payWord"), PAY, [{h:esc(L("resultWord")), f:r=> esc(tx(r.row.text))}, {h:"×", f:r=> "×"+r.row.mult}]);
}
const tab = DT.registerTab({
  id:"jobs", icon:"📜", order:20,
  title:{en:"Job Board", es:"Tablón de encargos"},
  tagline:{en:"Who pays, for what, where, by when and how much — scaled to the settlement and the party. Pick a saved city and its shopkeepers and rumors turn into jobs.", es:"Quién paga, por qué, dónde, para cuándo y cuánto — según el asentamiento y el grupo. Elige una ciudad guardada y sus tenderos y rumores se vuelven encargos."},
  strings:{
    en:{"jobs.settlement":"Settlement", "jobs.level":"Party level", "jobs.new":"🎲 New board", "jobs.board":"Board", "jobs.job":"Job", "jobs.patron":"Patron", "jobs.task":"Task",
      "jobs.where":"Where", "jobs.deadline":"Deadline", "jobs.reward":"Reward", "jobs.payWord":"Pay", "jobs.comp":"Complication", "jobs.truth":"Is the rumor true?",
      "jobs.rumorTask":"Look into the rumor", "jobs.fromRumor":"from a rumor", "jobs.rerollJob":"↻ Another job", "jobs.savedCities":"Saved cities (Vendors tab)",
      "jobs.anySize":"Any settlement", "jobs.empty":"Pick a settlement and the party level, then press \"New board\".", "jobs.countLog":"jobs on the board",
      "jobs.howMany":"How many jobs", "jobs.jobsWord":"Jobs", "jobs.base":"Base reward", "jobs.handout":"📋 Handout for players", "jobs.saved":"💾 Saved boards"},
    es:{"jobs.settlement":"Asentamiento", "jobs.level":"Nivel del grupo", "jobs.new":"🎲 Tablón nuevo", "jobs.board":"Tablón", "jobs.job":"Encargo", "jobs.patron":"Quién paga", "jobs.task":"Encargo",
      "jobs.where":"Dónde", "jobs.deadline":"Plazo", "jobs.reward":"Recompensa", "jobs.payWord":"Paga", "jobs.comp":"Complicación", "jobs.truth":"¿Es cierto el rumor?",
      "jobs.rumorTask":"Averiguar qué hay detrás del rumor", "jobs.fromRumor":"sale de un rumor", "jobs.rerollJob":"↻ Otro encargo", "jobs.savedCities":"Ciudades guardadas (pestaña Vendedores)",
      "jobs.anySize":"Cualquier asentamiento", "jobs.empty":"Elige asentamiento y nivel del grupo, y pulsa «Tablón nuevo».", "jobs.countLog":"encargos en el tablón",
      "jobs.howMany":"Cuántos encargos", "jobs.jobsWord":"Encargos", "jobs.base":"Recompensa base", "jobs.handout":"📋 Para los jugadores", "jobs.saved":"💾 Tablones guardados"}
  },
  emptyLibraryKey:"noResults",
  mount(panel){
    panel.innerHTML = `<div class="controls">
        <div class="row">
          <label class="sub"><span data-i18n="jobs.settlement"></span> <select data-ref="where"></select></label>
          <label class="sub"><span data-i18n="jobs.level"></span> <select data-ref="tier"></select></label>
          <button class="primary" data-ref="roll" data-i18n="jobs.new"></button>
        </div>
        <div class="row" style="margin-top:10px">
          <input type="text" data-ref="name" style="flex:1; min-width:160px"><button class="small" data-ref="rename" data-i18n="renameBtn"></button>
        </div>
        <div class="row" style="margin-top:10px" data-ref="shareRow" hidden>
          <button class="small" data-ref="copy" data-i18n="copyMdShort"></button>
          <button class="small" data-ref="handout" data-i18n="jobs.handout"></button>
          <button class="small host" data-ref="screen" data-i18n="toScreenShort" hidden></button>
        </div></div>
      <div class="grid" style="margin-top:14px" data-ref="cards"></div>
      <h2 data-i18n="jobs.saved"></h2>
      <div class="controls"><div class="savebar"><button data-ref="exportAll" data-i18n="exportAll"></button><button data-ref="import" data-i18n="importBtn"></button></div>
        <div data-ref="lib" style="margin-top:10px"></div></div>
      <h2 data-i18n="refTitle"></h2><div data-ref="refs"></div>`;
    DT.applyI18n(panel);
    refs = DT.refs(panel);
    refs.roll.onclick = newBoard;
    const rename = ()=>{ const v = refs.name.value.trim(); if(cur && v){ cur.name = v; persist(); } };
    refs.rename.onclick = rename;
    refs.name.addEventListener("keydown", e=>{ if(e.key==="Enter") rename(); });
    refs.copy.onclick = ()=>{ if(cur) DT.copyText(boardMarkdown(cur, {dm:true})); };
    refs.handout.onclick = ()=>{ if(cur) DT.copyText(boardMarkdown(cur, {dm:false})); };
    refs.screen.onclick = ()=>{ if(cur) DT.bridge.toScreen({label:cur.name, w:440, h:560, md:boardMarkdown(cur, {dm:true})}); };
    refs.exportAll.onclick = ()=>{ const l = DT.records.list("jobs"); if(!l.length) return alert(L("alertNothingToExport")); DT.io.exportMany(l, "jobs"); };
    refs.import.onclick = ()=> DT.io.pickFile();
    DT.library(refs.lib, "jobs");
    // Si cambian las ciudades guardadas (se genera o se borra una), el selector se entera.
    DT.records.onChange(ev=>{ if(refs && (ev.type==="external" || (ev.rec && ev.rec.tab==="vendors"))) renderSelectors(); });
    cur = DT.records.active("jobs");
    renderSelectors(); render();
  },
  onShow(){ if(refs){ renderSelectors(); render(); } },
  onLang(){ if(refs){ renderSelectors(); render(); } },
  load(rec){ cur = rec; DT.records.setActive("jobs", rec.id); if(refs){ renderSelectors(); render(); } DT.refreshLibraries(); },
  current: ()=> cur,
  onRemoved(rec){ if(cur && cur.id===rec.id){ cur = null; render(); } },
  validate: data=> !!(data && Array.isArray(data.jobs) && data.jobs.every(j=> j && Number.isFinite(j.base))),
  summary(rec){ const d = rec.data; return {chips:[d.city ? d.city.name : sizeText(d.size), tx(tierOf(d.tier).text)], meta:[`${d.jobs.length} ${L("jobs.jobsWord").toLowerCase()}`], detail:d.jobs.map(taskText).join(" · ")}; },
  toMarkdown: (rec, opts={})=> boardMarkdown(rec, opts)
});
tab.api = {PATRON, TASK, WHERE, COMP, DEADLINE, PAY, TIERS, COUNT, reward, rollJob, shopkeepers, boardMarkdown, current:()=>cur, newBoard:()=>newBoard(), select:(where, tier)=>{ if(refs){ refs.where.value=where; refs.tier.value=tier; } }};
})();
</script>

  // Escala el dragón al viewport (conservando proporción) y fija las posiciones destino
  function computeTargets(){
    const pts=DRAGON.pts;
    const maxW=W*0.62, maxH=H*0.66;
    let dw=maxW, dh=dw/DRAGON.aspect;
    if(dh>maxH){ dh=maxH; dw=dh*DRAGON.aspect; }
    const cx=W/2, cy=H/2, t=[];
    for(let i=0;i<pts.length;i++){ t.push([ cx+(pts[i][0]/1000-0.5)*dw, cy+(pts[i][1]/1000-0.5)*dh ]); }
    for(let i=t.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0, q=t[i]; t[i]=t[j]; t[j]=q; }
    targets=t;
    for(let i=0;i<particles.length;i++){ const q=targets[i%targets.length]; particles[i].tx=q[0]; particles[i].ty=q[1]; }
  }

  // Máquina de fases: seguir → reaccionar → formar imagen → mantener → explotar → loop
  const SEQ = REDUCED
    ? [["follow",11000],["form",7500],["hold",5500]]
    : [["follow",9500],["react",9500],["form",6500],["hold",4000],["explode",5000]];
  let pi=0, phase=SEQ[0][0], phaseEnd=0;
  let imgMix=0, followW=0, reactW=0;

  function nextPhase(now){
    pi=(pi+1)%SEQ.length; phase=SEQ[pi][0]; phaseEnd=now+SEQ[pi][1];
    if(phase==="form" && !targets.length) computeTargets();
    if(phase==="explode") explode();
  }
  function explode(){
    const cx=W/2, cy=H/2, diag=Math.hypot(W,H)/2;
    for(const p of particles){
      let dx=p.x-cx, dy=p.y-cy, d=Math.hypot(dx,dy)||1;
      const sp=rand(2.5,7)*(0.6+(d/diag)*0.8);
      p.vx+=dx/d*sp+rand(-1.1,1.1); p.vy+=dy/d*sp+rand(-1.1,1.1);
    }
  }

  // Ondas espaciales sutiles, siempre presentes (aurora/nebulosa lenta)
  const WAVES=[
    {c:[168,211,0], y:0.30, amp:0.10, k:1.3, sp:0.055, a:0.045, w:1.5},
    {c:[0,255,255], y:0.50, amp:0.08, k:1.8, sp:-0.042, a:0.038, w:1.2},
    {c:[168,211,0], y:0.68, amp:0.12, k:1.0, sp:0.036, a:0.034, w:1.6},
    {c:[0,255,255], y:0.85, amp:0.07, k:2.2, sp:-0.060, a:0.030, w:1.1}
  ];
  function drawWaves(now){
    const t=now*0.001;
    ctx.globalCompositeOperation="lighter";
    for(const b of WAVES){
      const yb=H*b.y, amp=H*b.amp, ph=t*b.sp*6;
      ctx.beginPath();
      for(let x=0;x<=W;x+=14){
        const y=yb + Math.sin(x/W*6.2832*b.k + ph)*amp
                   + Math.sin(x/W*6.2832*b.k*2.4 + ph*1.7)*amp*0.28;
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle="rgba("+b.c[0]+","+b.c[1]+","+b.c[2]+","+b.a+")";
      ctx.lineWidth=b.w; ctx.stroke();
    }
  }

  function frame(now){
    if(!running) return;
    if(!phaseEnd) phaseEnd=now+SEQ[0][1];
    if(now>=phaseEnd) nextPhase(now);

    const dImg=(phase==="form"||phase==="hold")?1:0;
    imgMix+=(dImg-imgMix)*0.022;
    followW+=((phase==="follow"?1:0)-followW)*0.03;
    reactW +=((phase==="react" ?1:0)-reactW )*0.03;

    // rastro (más nítido al formar la imagen)
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle="rgba(8,9,9,"+(0.16+0.42*imgMix)+")";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    drawWaves(now);

    const free=1-imgMix, R=150, R2=R*R;
    for(const p of particles){
      let ax=0, ay=0;
      if(imgMix>0.001){ ax+=(p.tx-p.x)*0.014*imgMix; ay+=(p.ty-p.y)*0.014*imgMix; }
      if(free>0.001){
        p.seed+=0.006;
        ax+=Math.cos(p.seed)*0.014*free; ay+=Math.sin(p.seed*1.3)*0.014*free;
        if(followW>0.01){ // gravita y orbita el cursor
          const dx=mx-p.x, dy=my-p.y, d=Math.hypot(dx,dy)||1, pull=0.0011*followW*free;
          ax+=dx*pull+(-dy/d)*0.24*followW*free; ay+=dy*pull+(dx/d)*0.24*followW*free;
          if(d<48){ ax-=dx/d*0.45*followW; ay-=dy/d*0.45*followW; }
        }
        if(reactW>0.01){ // repele del cursor
          const dx=p.x-mx, dy=p.y-my, d2=dx*dx+dy*dy;
          if(d2<R2){ const d=Math.sqrt(d2)||1, f=(1-d/R)*1.4*reactW; ax+=dx/d*f; ay+=dy/d*f; }
        }
      }
      p.vx+=ax; p.vy+=ay;
      const damp=0.925+0.045*imgMix; p.vx*=damp; p.vy*=damp;
      const s2=p.vx*p.vx+p.vy*p.vy; if(s2>196){ const s=14/Math.sqrt(s2); p.vx*=s; p.vy*=s; }
      p.x+=p.vx; p.y+=p.vy;
      if(imgMix<0.3){
        if(p.x<-20)p.x=W+20; else if(p.x>W+20)p.x=-20;
        if(p.y<-20)p.y=H+20; else if(p.y>H+20)p.y=-20;
      }
      const c0=p.base, c1=p.img;
      const r=lerp(c0[0],c1[0],imgMix)|0, g=lerp(c0[1],c1[1],imgMix)|0, b=lerp(c0[2],c1[2],imgMix)|0;
      ctx.fillStyle="rgba("+r+","+g+","+b+","+(0.55+0.35*imgMix)+")";
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1+0.25*imgMix),0,6.2832); ctx.fill();
    }
    raf=requestAnimationFrame(frame);
  }

  function start(){ if(raf)cancelAnimationFrame(raf); running=true; raf=requestAnimationFrame(frame); }
  function stop(){ running=false; if(raf)cancelAnimationFrame(raf); raf=0; }

  const tgl=document.getElementById("bgToggle");
  function setRun(on){
    if(on){ DT.storage.pref("bgOff", null); if(tgl){tgl.textContent="✦"; tgl.style.opacity=".5";} start(); }
    else{ DT.storage.pref("bgOff","1"); stop();
      ctx.globalCompositeOperation="source-over"; ctx.fillStyle="rgb(8,9,9)"; ctx.fillRect(0,0,W,H);
      if(tgl){tgl.textContent="○"; tgl.style.opacity="1";} }
  }
  if(tgl) tgl.onclick=()=>setRun(!running);

  window.addEventListener("mousemove",e=>{mx=e.clientX; my=e.clientY;});
  window.addEventListener("touchmove",e=>{ if(e.touches[0]){mx=e.touches[0].clientX; my=e.touches[0].clientY;} },{passive:true});
  let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(resize,200); });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) stop(); else if(!DT.storage.pref("bgOff")) start(); });

  resize();
  if(DT.storage.pref("bgOff")) setRun(false); else start();
})();
